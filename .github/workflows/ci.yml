name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            triplet: x64-windows
          - os: macos-latest
            triplet: arm64-osx
          - os: ubuntu-latest
            triplet: x64-linux
    steps:
      - uses: actions/checkout@v4

      - name: 安装 Linux 构建依赖
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build pkg-config

      - name: Configure（vcpkg manifest 模式自动装依赖）
        shell: bash
        env:
          # 与本地 tools/vcpkg-install.ps1 同一套 overlay，保证 CI 与开发机
          # 装出同一份依赖集：
          #   vcpkg-triplets —— 只编 Release（x64-windows；其余平台用自带 triplet）
          #   vcpkg-ports   —— trantor 去掉 openssl（服务只绑回环，不需要 TLS，
          #                     省掉 openssl 全量构建）
          VCPKG_OVERLAY_TRIPLETS: ${{ github.workspace }}/tools/vcpkg-triplets
          VCPKG_OVERLAY_PORTS: ${{ github.workspace }}/tools/vcpkg-ports
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_TOOLCHAIN_FILE="$VCPKG_INSTALLATION_ROOT/scripts/buildsystems/vcpkg.cmake" \
            -DVCPKG_TARGET_TRIPLET=${{ matrix.triplet }} \
            -DVCPKG_INSTALL_OPTIONS="--clean-after-build" \
            -DBUILD_SERVER=ON \
            -DBUILD_GUI=ON \
            "-DVCPKG_MANIFEST_FEATURES=server;gui"

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Test
        run: ctest --test-dir build --build-config Release --output-on-failure

      # GUI 的渲染层要显示环境，CI 的 Linux/macOS runner 无显示服务器。
      # 分层验收：数据层（DbSession + 面板数据装配）由 genealogy-gui-tests
      # 覆盖，已在上一步随 ctest 跑过；渲染层用 --headless-check 验证
      # 「环境判定与报错路径」本身——退出码 2 = 无显示（环境事实，非缺陷），
      # 0 = 显示可用。真要看到窗口，靠开发者本机与内部试用。
      - name: GUI 无头自检
        shell: bash
        run: |
          ./build/bin/genealogy-gui --headless-check || \
          test $? -eq 2

      - name: 许可证白名单卡点（含禁 Qt 检查）
        shell: bash
        run: python3 tools/license_check.py

      # spec 是客户端代码生成的唯一事实源：spec 写坏（断引用、类型错误）
      # 不会让任何 C++ 编译失败，只会在几个月后对接第三方时炸。
      # 元 schema + 项目约定（$ref 可解析、每 operation 有 operationId 与
      # 2xx）全在这里当天红。
      - name: OpenAPI 规范校验
        shell: bash
        run: |
          pip install pyyaml openapi-spec-validator
          python tools/validate_openapi.py

      # M2 验收硬指标：「TS 客户端由生成器产出并可跑通读写」。
      # 只在 Windows 跑（server 二进制与 vcpkg DLL 路径都已就绪；
      # spec 与生成器本身跨平台无差异，无需三平台重复）。
      # smoke 会自建临时库、自选端口、跑完自清理，不碰真实数据。
      - name: TS 客户端（生成 + 类型检查 + 读写冒烟）
        if: runner.os == 'Windows'
        shell: bash
        run: |
          cd clients/web
          npm ci
          npm run generate
          npm run typecheck
          # runner 预置 $VCPKG_INSTALLATION_ROOT；DLL 上 PATH，
          # smoke 自拉的 server 才找得到 drogon/trantor/jsoncpp
          export PATH="$VCPKG_INSTALLATION_ROOT/installed/x64-windows/bin:$PATH"
          npm run smoke

      # M5 验收硬指标：「浏览器端完成建档→关系→世系图→导出闭环」。
      # playwright 驱动真实 Chromium 实际操作 UI（12 项断言），
      # 失败即闭环有洞——比任何单元测试都接近真实用户路径。
      - name: UI 浏览器闭环（playwright）
        if: runner.os == 'Windows'
        shell: bash
        run: |
          cd clients/web
          npx playwright install chromium
          npm run ui-smoke
