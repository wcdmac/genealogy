name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            triplet: x64-windows
          - os: macos-latest
            triplet: arm64-osx
          - os: ubuntu-latest
            triplet: x64-linux
    steps:
      - uses: actions/checkout@v4

      - name: 安装 Linux 构建依赖
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build pkg-config

      - name: Configure（vcpkg manifest 模式自动装依赖）
        shell: bash
        env:
          # 与本地 tools/vcpkg-install.ps1 同一套 overlay，保证 CI 与开发机
          # 装出同一份依赖集：
          #   vcpkg-triplets —— 只编 Release（x64-windows；其余平台用自带 triplet）
          #   vcpkg-ports   —— trantor 去掉 openssl（服务只绑回环，不需要 TLS，
          #                     省掉 openssl 全量构建）
          VCPKG_OVERLAY_TRIPLETS: ${{ github.workspace }}/tools/vcpkg-triplets
          VCPKG_OVERLAY_PORTS: ${{ github.workspace }}/tools/vcpkg-ports
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_TOOLCHAIN_FILE="$VCPKG_INSTALLATION_ROOT/scripts/buildsystems/vcpkg.cmake" \
            -DVCPKG_TARGET_TRIPLET=${{ matrix.triplet }} \
            -DVCPKG_INSTALL_OPTIONS="--clean-after-build" \
            -DBUILD_SERVER=ON \
            -DBUILD_GUI=ON \
            "-DVCPKG_MANIFEST_FEATURES=server;gui"

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Test
        run: ctest --test-dir build --build-config Release --output-on-failure

      # GUI 的渲染层要显示环境，CI 的 Linux/macOS runner 无显示服务器。
      # 分层验收：数据层（DbSession + 面板数据装配）由 genealogy-gui-tests
      # 覆盖，已在上一步随 ctest 跑过；渲染层用 --headless-check 验证
      # 「环境判定与报错路径」本身——退出码 2 = 无显示（环境事实，非缺陷），
      # 0 = 显示可用。真要看到窗口，靠开发者本机与内部试用。
      - name: GUI 无头自检
        shell: bash
        run: |
          ./build/bin/genealogy-gui --headless-check || \
          test $? -eq 2

      - name: 许可证白名单卡点（含禁 Qt 检查）
        shell: bash
        run: python3 tools/license_check.py
