name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    env:
      # Windows runner 的 Python stdout 默认 cp1252，中文输出直接
      # UnicodeEncodeError——八跑 license_check 在「检查通过」的消息上
      # 崩溃（检查本身是过了的）；本机控制台 GBK 能编码所以从未复现。
      # 强制所有 python 步骤 UTF-8（license/drill 全覆盖）。
      PYTHONUTF8: "1"
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            triplet: x64-windows
            cpack_gen: ZIP
            genea_bin: build/bin/genea.exe
          - os: macos-latest
            triplet: arm64-osx
            cpack_gen: DragNDrop
            genea_bin: build/bin/genea
          - os: ubuntu-latest
            triplet: x64-linux
            cpack_gen: TGZ
            genea_bin: build/bin/genea
    steps:
      # actions 一律固定 commit SHA（L6）——git ls-remote 匿名可达，
      # 「API 限额拿不到 SHA」是误判；上游移动 tag 即改变 CI 输入，
      # 与 vcpkg baseline/pip 版本固定同一纪律。升级时改 SHA，行尾
      # 注释保留标签名便于识别。
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      # Python 解释器探测：Windows runner 的 python3 是 MS Store 存根
      # （六跑许可证步骤在 Windows 单独挂、Ubuntu 同脚本通过的差异点），
      # 不能无脑统一 python3；ubuntu-24.04 又没有裸 python。实测可用者胜出。
      - name: 选 Python 解释器
        shell: bash
        run: |
          if python3 -c "import sys" 2>/dev/null; then
            echo "PY=python3" >> "$GITHUB_ENV"
          else
            echo "PY=python" >> "$GITHUB_ENV"
          fi

      # Windows 的 runner PATH 上 mingw64 排在 MSVC 前，-G Ninja 时 CMake
      # 会选中 GNU 编译器（2026-11-14 CI 实测），而依赖端口是 MSVC ABI
      # 装出来的，链接必炸；显式装载 MSVC 环境让 cl 成为默认编译器。
      - name: 装载 MSVC 环境（Windows）
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1

      # vcpkg 不用 runner 预装版：预装版本随 runner 镜像漂移，git 历史不
      # 含 manifest 的 builtin-baseline 时要现场 fetch，且「哪天镜像换了
      # 版本」这种变量不该出现在构建结果里。按 vcpkg.json 的
      # builtin-baseline 精确检出同一份 vcpkg，三平台同源。
      # baseline 单一来源：从 vcpkg.json 读取，避免双写漂移。
      - name: 读取 vcpkg baseline
        id: vcpkg_baseline
        shell: bash
        run: |
          BASELINE=$(python3 -c "import json;print(json.load(open('vcpkg.json'))['builtin-baseline'])")
          echo "value=$BASELINE" >> "$GITHUB_OUTPUT"
          echo "vcpkg baseline: $BASELINE"

      - name: 检出 vcpkg（pin 到 vcpkg.json 的 builtin-baseline）
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: microsoft/vcpkg
          ref: ${{ steps.vcpkg_baseline.outputs.value }}
          path: vcpkg

      - name: Bootstrap vcpkg
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then
            ./vcpkg/bootstrap-vcpkg.bat
          else
            ./vcpkg/bootstrap-vcpkg.sh
          fi

      # 端口产物按依赖指纹缓存：vcpkg.json / overlay 没变就不重编端口
      # （首跑 Windows 全量编 40+ 分钟；命中后 Configure 阶段降到几分钟）。
      - name: 缓存 vcpkg 端口产物
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: vcpkg-bincache
          key: vcpkg-${{ matrix.os }}-${{ steps.vcpkg_baseline.outputs.value }}-${{ hashFiles('vcpkg.json', 'tools/vcpkg-triplets/**') }}

      - name: 安装 Linux 构建依赖
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build pkg-config
          # vcpkg 端口在 Linux 上的系统依赖：
          #   autotools 套件 —— pthread-stubs（GLFW→xcb 依赖链）端口走
          #     autoreconf，runner 没有它（2026-11-14 CI 实测）
          #   uuid-dev —— drogon 的 FindUUID 需要 libuuid 开发文件
          #   xorg-dev + libgl1-mesa-dev —— GLFW 端口的 X11/OpenGL 头与库
          sudo apt-get install -y autoconf autoconf-archive automake libtool \
            uuid-dev xorg-dev libgl1-mesa-dev

      - name: Configure（vcpkg manifest 模式自动装依赖）
        shell: bash
        env:
          # 覆盖 runner 预装路径：统一用上面 pin 检出的 vcpkg
          VCPKG_INSTALLATION_ROOT: ${{ github.workspace }}/vcpkg
          # 二进制缓存目录（上面 cache 步骤的 path）
          VCPKG_DEFAULT_BINARY_CACHE: ${{ github.workspace }}/vcpkg-bincache
          # 与本地 tools/vcpkg-install.ps1 同一套 overlay，保证 CI 与开发机
          # 装出同一份依赖集：
          # vcpkg-triplets —— 只编 Release（x64-windows；其余平台用自带 triplet）
          VCPKG_OVERLAY_TRIPLETS: ${{ github.workspace }}/tools/vcpkg-triplets
        run: |
          mkdir -p "$VCPKG_DEFAULT_BINARY_CACHE"
          set -o pipefail
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_TOOLCHAIN_FILE="$VCPKG_INSTALLATION_ROOT/scripts/buildsystems/vcpkg.cmake" \
            -DVCPKG_TARGET_TRIPLET=${{ matrix.triplet }} \
            -DVCPKG_INSTALL_OPTIONS="--clean-after-build" \
            -DBUILD_GUI=ON \
            "-DVCPKG_MANIFEST_FEATURES=gui" 2>&1 | tee configure.log \
            && echo configure >> "$GITHUB_WORKSPACE/_ok.txt"

      - name: Build
        shell: bash
        run: |
          set -o pipefail
          cmake --build build --config Release --parallel 2>&1 | tee build.log \
            && echo build >> "$GITHUB_WORKSPACE/_ok.txt"

      - name: Test
        shell: bash
        run: |
          set -o pipefail
          ctest --test-dir build --build-config Release --output-on-failure 2>&1 | tee test.log \
            && echo test >> "$GITHUB_WORKSPACE/_ok.txt"

      # 第五轮 高-4：CLI 端到端断言（GEDCOM 往返、规则命中、备份拒绝覆盖、
      # 世系环鲁棒性等 77 项）此前只在本地跑，CI 从未执行。此处接入，
      # 用 matrix.genea_bin 传各平台产物路径（run_e2e.sh 已转 LF 且支持
      # GENEA_BIN 覆盖，Windows/Linux/macOS 通吃）。
      - name: CLI 端到端（77 项断言）
        shell: bash
        run: |
          set -o pipefail
          PY="$(command -v python3 || command -v python)"
          GENEA_BIN="${{ matrix.genea_bin }}" bash tools/testdata/run_e2e.sh 2>&1 | tee e2e.log \
            && echo e2e >> "$GITHUB_WORKSPACE/_ok.txt"

      # M6-1：三平台打包。CPack 内置生成器（ZIP/DRAGNDROP/TGZ），
      # 不引外部打包工具；产物上传供试装试跑。
      - name: 打包（CPack）
        shell: bash
        run: |
          cd build
          set -o pipefail
          cpack -G "${{ matrix.cpack_gen }}" --verbose 2>&1 | tee "$GITHUB_WORKSPACE/cpack.log" \
            && echo cpack >> "$GITHUB_WORKSPACE/_ok.txt"
          ls -la *.zip *.dmg *.tar.gz 2>/dev/null || true

      - name: 上传打包产物
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: genealogy-${{ matrix.os }}
          path: |
            build/*.zip
            build/*.dmg
            build/*.tar.gz
          if-no-files-found: error

      # GUI 的渲染层要显示环境，CI 的 Linux/macOS runner 无显示服务器。
      # 分层验收：数据层入口 DbSession（GUI 调 core 用例的同一条链）由
      # genealogy-gui-tests 覆盖，已在上一步随 ctest 跑过；面板状态机
      # （*_state.cpp）同样编入该目标由单测直接驱动；渲染层用
      # --headless-check 验证「环境判定与报错路径」
      # 本身——退出码 2 = 无显示（环境事实，非缺陷），0 = 显示可用。
      # 真要看到窗口，靠开发者本机与内部试用。
      - name: GUI 无头自检
        shell: bash
        run: |
          set +e
          OUT=$(./build/bin/genealogy-gui --headless-check 2>&1)
          RC=$?
          set -e
          echo "$OUT"
          if [ $RC -eq 0 ]; then exit 0; fi
          # 只有明确的"无法初始化 GLFW（无显示）"才是环境事实；
          # 同样返回 2 的"未知参数"等错误必须让 CI 失败。
          if [ $RC -eq 2 ] && echo "$OUT" | grep -q "无法初始化 GLFW"; then
            exit 0
          fi
          exit $RC

      - name: 许可证白名单卡点（含禁 Qt 检查）
        shell: bash
        run: |
          set -o pipefail
          $PY tools/license_check.py 2>&1 | tee "$GITHUB_WORKSPACE/license.log" \
            || exit 1
          # 前端已随单机定位裁撤（2026-11-21）：.tsx 覆盖断言同步移除
          # （TEXT_SUFFIXES 的前端/脚本后缀集保留，npm 依赖若回归录入，
          # allowlist 卡点仍然生效）。
          echo license >> "$GITHUB_WORKSPACE/_ok.txt"

      # M6-3 验收硬指标：「备份恢复演练通过」。灌合成谱 → 备份 →
      # 删库（模拟事故）→ 恢复 → 核对人物数一致，另验 --force 保护。
      - name: 备份恢复演练
        shell: bash
        # CLI 产物名平台各异（Windows 有 .exe 后缀），从 matrix 取；
        # 统一 python3（ubuntu-24.04 没有裸 python 命令）
        run: |
          set -o pipefail
          $PY tools/drill_backup_restore.py --genea "${{ matrix.genea_bin }}" 2>&1 | tee "$GITHUB_WORKSPACE/drill.log" \
            && echo drill >> "$GITHUB_WORKSPACE/_ok.txt"

      # spec 是客户端代码生成的唯一事实源：spec 写坏（断引用、类型错误）
      # 不会让任何 C++ 编译失败，只会在几个月后对接第三方时炸。
      # 元 schema + 项目约定（$ref 可解析、每 operation 有 operationId 与
      # 2xx）全在这里当天红。
      # 【2026-11-21 裁撤】单机定位后 REST/OpenAPI/TS 客户端整体移除，
      # 本步骤随之删除（git 历史可考）。

      # M2 验收硬指标：「TS 客户端由生成器产出并可跑通读写」。
      # 只在 Windows 跑（server 二进制与 vcpkg DLL 路径都已就绪；
      # spec 与生成器本身跨平台无差异，无需三平台重复）。
      # smoke 会自建临时库、自选端口、跑完自清理，不碰真实数据。
      # 【2026-11-21 裁撤】同上，随 REST 定位收口移除。

      # M5 验收硬指标：「浏览器端完成建档→关系→世系图→导出闭环」。
      # playwright 驱动真实 Chromium 实际操作 UI，失败即闭环有洞——
      # 比任何单元测试都接近真实用户路径。
      # dist/ 已移出仓库（.gitignore），必须先构建——否则 ui-smoke 的
      # 前置检查（dist/index.html 缺失 → 退出码 2）必红。
      # UI 浏览器闭环（playwright）
      # 【2026-11-21 裁撤】Web 参考客户端随单机定位移除。

      # 失败诊断：完整日志只有认证后才能经 API 拉取，而 annotations
      # 匿名可读（含本机网络只通 api.github.com 的场景）。失败时把
      # 对应日志尾部切成 ::error:: 注解回传，拿正文不再依赖 gh 登录。
      # 必须放在 job 末尾：if: failure() 在步骤轮到时求值一次，
      # 放在 Test 后面时 Test 一过就永远跳过，其后步骤的失败全进盲区
      # （六跑 Windows 许可证/macOS 打包有日志却无注解的原因）。
      - name: 失败诊断（日志尾部回传 annotations）
        if: failure()
        shell: bash
        run: |
          # 只回传「跑过且失败」的日志：tee 落盘对成功步骤也会发生，
          # 而 GitHub 每步骤注解上限 10 条（七跑 Windows 的 license.log
          # 被成功步骤的 configure/build/test/cpack 注解挤掉的原因）。
          # 每步成功后写 _ok.txt 标记，这里跳过仍标记着的。
          emitted=0
          for pair in "configure.log Configure" "build.log Build" "test.log Test" "e2e.log CLI端到端" "cpack.log 打包" "license.log 许可证" "drill.log 演练"; do
            set -- $pair
            LOG=$1; LABEL=$2
            NAME=${LOG%.log}
            [ -f "$LOG" ] || continue
            if [ -f _ok.txt ] && grep -qx "$NAME" _ok.txt; then continue; fi
            if [ "$emitted" -ge 8 ]; then break; fi
            tail -n 60 "$LOG" | sed -e 's/\r$//' -e 's/%/%25/g' | \
            awk -v label="$LABEL" -v file="$LOG" '
              {buf = buf (NR>1 ? "%0A" : "") $0}
              NR%30==0 {print "::error title=" label "（" file "）尾段" NR/30 "::" buf; buf=""}
              END {if (buf != "") print "::error title=" label "（" file "）尾段末::" buf}
            '
            emitted=$((emitted + 2))
          done
