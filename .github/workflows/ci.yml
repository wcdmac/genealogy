name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            triplet: x64-windows
            cpack_gen: ZIP
            genea_bin: build/bin/genea.exe
          - os: macos-latest
            triplet: arm64-osx
            cpack_gen: DRAGNDROP
            genea_bin: build/bin/genea
          - os: ubuntu-latest
            triplet: x64-linux
            cpack_gen: TGZ
            genea_bin: build/bin/genea
    steps:
      - uses: actions/checkout@v4

      # Windows 的 runner PATH 上 mingw64 排在 MSVC 前，-G Ninja 时 CMake
      # 会选中 GNU 编译器（2026-11-14 CI 实测），而依赖端口是 MSVC ABI
      # 装出来的，链接必炸；显式装载 MSVC 环境让 cl 成为默认编译器。
      - name: 装载 MSVC 环境（Windows）
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1

      # vcpkg 不用 runner 预装版：预装版本随 runner 镜像漂移，git 历史不
      # 含 manifest 的 builtin-baseline 时要现场 fetch，且「哪天镜像换了
      # 版本」这种变量不该出现在构建结果里。按 vcpkg.json 的
      # builtin-baseline 精确检出同一份 vcpkg，三平台同源。
      # 改 vcpkg.json 的 builtin-baseline 时同步改这里。
      - name: 检出 vcpkg（pin 到 vcpkg.json 的 builtin-baseline）
        uses: actions/checkout@v4
        with:
          repository: microsoft/vcpkg
          ref: e456309491fd875487bf02b8a0dca76c1b1b00cc
          path: vcpkg

      - name: Bootstrap vcpkg
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then
            ./vcpkg/bootstrap-vcpkg.bat
          else
            ./vcpkg/bootstrap-vcpkg.sh
          fi

      # 端口产物按依赖指纹缓存：vcpkg.json / overlay 没变就不重编端口
      # （首跑 Windows 全量编 40+ 分钟；命中后 Configure 阶段降到几分钟）。
      - name: 缓存 vcpkg 端口产物
        uses: actions/cache@v4
        with:
          path: vcpkg-bincache
          key: vcpkg-${{ matrix.os }}-${{ hashFiles('vcpkg.json', 'tools/vcpkg-ports/**', 'tools/vcpkg-triplets/**') }}

      - name: 安装 Linux 构建依赖
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build pkg-config
          # vcpkg 端口在 Linux 上的系统依赖：
          #   autotools 套件 —— pthread-stubs（GLFW→xcb 依赖链）端口走
          #     autoreconf，runner 没有它（2026-11-14 CI 实测）
          #   uuid-dev —— drogon 的 FindUUID 需要 libuuid 开发文件
          #   xorg-dev + libgl1-mesa-dev —— GLFW 端口的 X11/OpenGL 头与库
          sudo apt-get install -y autoconf autoconf-archive automake libtool \
            uuid-dev xorg-dev libgl1-mesa-dev

      - name: Configure（vcpkg manifest 模式自动装依赖）
        shell: bash
        env:
          # 覆盖 runner 预装路径：统一用上面 pin 检出的 vcpkg
          VCPKG_INSTALLATION_ROOT: ${{ github.workspace }}/vcpkg
          # 二进制缓存目录（上面 cache 步骤的 path）
          VCPKG_DEFAULT_BINARY_CACHE: ${{ github.workspace }}/vcpkg-bincache
          # 与本地 tools/vcpkg-install.ps1 同一套 overlay，保证 CI 与开发机
          # 装出同一份依赖集：
          #   vcpkg-triplets —— 只编 Release（x64-windows；其余平台用自带 triplet）
          #   vcpkg-ports   —— trantor 去掉 openssl（服务只绑回环，不需要 TLS，
          #                     省掉 openssl 全量构建）
          VCPKG_OVERLAY_TRIPLETS: ${{ github.workspace }}/tools/vcpkg-triplets
          VCPKG_OVERLAY_PORTS: ${{ github.workspace }}/tools/vcpkg-ports
        run: |
          mkdir -p "$VCPKG_DEFAULT_BINARY_CACHE"
          set -o pipefail
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_TOOLCHAIN_FILE="$VCPKG_INSTALLATION_ROOT/scripts/buildsystems/vcpkg.cmake" \
            -DVCPKG_TARGET_TRIPLET=${{ matrix.triplet }} \
            -DVCPKG_INSTALL_OPTIONS="--clean-after-build" \
            -DBUILD_SERVER=ON \
            -DBUILD_GUI=ON \
            "-DVCPKG_MANIFEST_FEATURES=server;gui" 2>&1 | tee configure.log

      - name: Build
        shell: bash
        run: |
          set -o pipefail
          cmake --build build --config Release --parallel 2>&1 | tee build.log

      - name: Test
        shell: bash
        run: |
          set -o pipefail
          ctest --test-dir build --build-config Release --output-on-failure 2>&1 | tee test.log

      # 失败诊断：完整日志只有认证后才能经 API 拉取，而 annotations
      # 匿名可读（含本机网络只通 api.github.com 的场景）。失败时把
      # 对应日志尾部切成 ::error:: 注解回传，拿正文不再依赖 gh 登录。
      - name: 失败诊断（日志尾部回传 annotations）
        if: failure()
        shell: bash
        run: |
          for pair in "configure.log Configure" "build.log Build" "test.log Test"; do
            set -- $pair
            LOG=$1; LABEL=$2
            [ -f "$LOG" ] || continue
            tail -n 120 "$LOG" | sed -e 's/\r$//' -e 's/%/%25/g' | \
            awk -v label="$LABEL" -v file="$LOG" '
              {buf = buf (NR>1 ? "%0A" : "") $0}
              NR%30==0 {print "::error title=" label "（" file "）尾段" NR/30 "::" buf; buf=""}
              END {if (buf != "") print "::error title=" label "（" file "）尾段末::" buf}
            '
          done

      # M6-1：三平台打包。CPack 内置生成器（ZIP/DRAGNDROP/TGZ），
      # 不引外部打包工具；产物上传供试装试跑。
      - name: 打包（CPack）
        shell: bash
        run: |
          cd build
          cpack -G "${{ matrix.cpack_gen }}" --verbose
          ls -la *.zip *.dmg *.tar.gz 2>/dev/null || true

      - name: 上传打包产物
        uses: actions/upload-artifact@v4
        with:
          name: genealogy-${{ matrix.os }}
          path: |
            build/*.zip
            build/*.dmg
            build/*.tar.gz
          if-no-files-found: error

      # GUI 的渲染层要显示环境，CI 的 Linux/macOS runner 无显示服务器。
      # 分层验收：数据层入口 DbSession（GUI 调 core 用例的同一条链）由
      # genealogy-gui-tests 覆盖，已在上一步随 ctest 跑过；面板装配函数
      # 目前与 ImGui 同 TU 且私有于面板类，尚未纳入无头测试（见 ROADMAP
      # 暂缓项）；渲染层用 --headless-check 验证「环境判定与报错路径」
      # 本身——退出码 2 = 无显示（环境事实，非缺陷），0 = 显示可用。
      # 真要看到窗口，靠开发者本机与内部试用。
      - name: GUI 无头自检
        shell: bash
        run: |
          ./build/bin/genealogy-gui --headless-check || \
          test $? -eq 2

      - name: 许可证白名单卡点（含禁 Qt 检查）
        shell: bash
        run: python3 tools/license_check.py

      # M6-3 验收硬指标：「备份恢复演练通过」。灌合成谱 → 备份 →
      # 删库（模拟事故）→ 恢复 → 核对人物数一致，另验 --force 保护。
      - name: 备份恢复演练
        shell: bash
        # CLI 产物名平台各异（Windows 有 .exe 后缀），从 matrix 取
        run: python tools/drill_backup_restore.py --genea "${{ matrix.genea_bin }}"

      # spec 是客户端代码生成的唯一事实源：spec 写坏（断引用、类型错误）
      # 不会让任何 C++ 编译失败，只会在几个月后对接第三方时炸。
      # 元 schema + 项目约定（$ref 可解析、每 operation 有 operationId 与
      # 2xx）全在这里当天红。
      - name: OpenAPI 规范校验
        shell: bash
        run: |
          pip install pyyaml openapi-spec-validator
          python tools/validate_openapi.py

      # M2 验收硬指标：「TS 客户端由生成器产出并可跑通读写」。
      # 只在 Windows 跑（server 二进制与 vcpkg DLL 路径都已就绪；
      # spec 与生成器本身跨平台无差异，无需三平台重复）。
      # smoke 会自建临时库、自选端口、跑完自清理，不碰真实数据。
      - name: TS 客户端（生成 + 类型检查 + 读写冒烟）
        if: runner.os == 'Windows'
        shell: bash
        run: |
          cd clients/web
          npm ci
          npm run generate
          npm run typecheck
          # manifest 模式的依赖装在 build/vcpkg_installed/（不是 vcpkg 根的
          # installed/，那里从没人填过）；DLL 上 PATH，smoke 自拉的 server
          # 才找得到 drogon/trantor/jsoncpp
          export PATH="$GITHUB_WORKSPACE/build/vcpkg_installed/x64-windows/bin:$PATH"
          npm run smoke

      # M5 验收硬指标：「浏览器端完成建档→关系→世系图→导出闭环」。
      # playwright 驱动真实 Chromium 实际操作 UI，失败即闭环有洞——
      # 比任何单元测试都接近真实用户路径。
      # dist/ 已移出仓库（.gitignore），必须先构建——否则 ui-smoke 的
      # 前置检查（dist/index.html 缺失 → 退出码 2）必红。
      - name: UI 浏览器闭环（playwright）
        if: runner.os == 'Windows'
        shell: bash
        run: |
          cd clients/web
          npm run build
          npx playwright install chromium
          # ui-smoke 自拉 server 二进制，同样需要 manifest 依赖的 DLL 在 PATH
          export PATH="$GITHUB_WORKSPACE/build/vcpkg_installed/x64-windows/bin:$PATH"
          npm run ui-smoke
