openapi: 3.1.0
info:
  title: Genealogy API
  version: 1.0.0
  description: |
    家谱管理软件对外开放 API。核心逻辑由 C++ (libgenealogy-core) 实现，
    本规范为客户端代码生成的唯一事实源。

    通用约定：
    - 所有 ID 为 ULID（26 字符，字典序可排序）。
    - 日期统一使用 GenealogyDate 复合对象（公历/农历/年号/干支/精度），
      禁止使用裸日期字符串。
    - 列表端点使用游标分页（limit + cursor）。
    - 写操作支持 Idempotency-Key 头与 If-Match 乐观并发。
    - 错误使用 application/problem+json（RFC 9457）。
  license:
    name: MIT

servers:
  - url: http://127.0.0.1:8080/api/v1
    description: 本地模式（默认）
  - url: https://{host}/api/v1
    description: 服务端模式
    variables:
      host:
        default: genealogy.example.com

security:
  - bearerAuth: []

tags:
  - name: auth
  - name: lineages
  - name: branches
  - name: persons
  - name: lineage-algorithms
  - name: unions
  - name: events
  - name: migrations
    description: 迁徙（规划中，M5；见根级 x-roadmap）
  - name: places
  - name: sources
    description: 文献来源（规划中，M5；见根级 x-roadmap）
  - name: citations
    description: 证据挂接（规划中，M5；见根级 x-roadmap）
  - name: documents
    description: 谱序/凡例/家训/艺文/契约（规划中，M5；见根级 x-roadmap）
  - name: attachments
    description: 附件（规划中，M5；见根级 x-roadmap）
  - name: search-stats
  - name: validate
  - name: import-export

paths:
  /auth/token:
    post:
      tags: [auth]
      summary: 登录获取 JWT
      operationId: issueToken
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [username, password]
              properties:
                username: { type: string }
                password: { type: string, format: password }
      responses:
        "200":
          description: 成功
          content:
            application/json:
              schema:
                type: object
                properties:
                  access_token: { type: string }
                  token_type: { type: string, const: Bearer }
                  expires_in: { type: integer }
                  role: { $ref: "#/components/schemas/Role" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /me:
    get:
      tags: [auth]
      summary: 当前用户与角色
      operationId: getCurrentUser
      responses:
        "200":
          description: 成功
          content:
            application/json:
              schema:
                type: object
                properties:
                  username: { type: string }
                  role: { $ref: "#/components/schemas/Role" }
                  lineage_ids:
                    type: array
                    items: { type: string }

  /health:
    get:
      tags: [auth]
      summary: 探活（顺带验证数据库可用）
      operationId: health
      responses:
        "200":
          description: 成功
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { enum: [ok, degraded] }
                  version: { type: string }

  /lineages:
    get:
      tags: [lineages]
      summary: 宗族列表
      operationId: listLineages
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
      responses:
        "200": { $ref: "#/components/responses/Page" }
    post:
      tags: [lineages]
      summary: 创建宗族
      operationId: createLineage
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/LineageCreate" }
      responses:
        "201":
          description: 已创建
          headers:
            ETag: { $ref: "#/components/headers/ETag" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Lineage" }
        "400": { $ref: "#/components/responses/BadRequest" }

  /lineages/{id}:
    parameters:
      - $ref: "#/components/parameters/Id"
    get:
      tags: [lineages]
      summary: 宗族详情
      operationId: getLineage
      responses:
        "200":
          description: 成功
          headers:
            ETag: { $ref: "#/components/headers/ETag" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Lineage" }
        "404": { $ref: "#/components/responses/NotFound" }
    patch:
      tags: [lineages]
      summary: 更新宗族
      operationId: updateLineage
      parameters:
        - $ref: "#/components/parameters/IfMatch"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/LineageUpdate" }
      responses:
        "200":
          description: 成功
          headers:
            ETag: { $ref: "#/components/headers/ETag" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Lineage" }
        "409": { $ref: "#/components/responses/Conflict" }
    delete:
      tags: [lineages]
      summary: 删除宗族
      operationId: deleteLineage
      responses:
        "204": { description: 已删除 }

  /branches:
    get:
      tags: [branches]
      summary: 支派列表
      operationId: listBranches
      parameters:
        - name: lineage_id
          in: query
          schema: { type: string }
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
      responses:
        "200": { $ref: "#/components/responses/Page" }
    post:
      tags: [branches]
      summary: 创建支派/房
      operationId: createBranch
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/BranchCreate" }
      responses:
        "201":
          description: 已创建
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Branch" }

  /branches/{id}:
    parameters:
      - $ref: "#/components/parameters/Id"
    get:
      tags: [branches]
      summary: 支派详情
      operationId: getBranch
      responses:
        "200":
          description: 成功
          headers:
            ETag: { $ref: "#/components/headers/ETag" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Branch" }
        "404": { $ref: "#/components/responses/NotFound" }
    patch:
      tags: [branches]
      summary: 更新支派
      operationId: updateBranch
      parameters:
        - $ref: "#/components/parameters/IfMatch"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: string }
                founder_person_id: { type: string }
                parent_branch_id: { type: string }
                generation_char: { type: string }
      responses:
        "200":
          description: 成功
          headers:
            ETag: { $ref: "#/components/headers/ETag" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Branch" }
        "409": { $ref: "#/components/responses/Conflict" }
    delete:
      tags: [branches]
      summary: 删除支派
      operationId: deleteBranch
      responses:
        "204": { description: 已删除 }

  /branches/{id}/tree:
    parameters:
      - $ref: "#/components/parameters/Id"
    get:
      tags: [branches]
      summary: 支派树
      operationId: getBranchTree
      responses:
        "200":
          description: 成功
          content:
            application/json:
              schema:
                type: object
                properties:
                  root: { $ref: "#/components/schemas/BranchNode" }

  /persons:
    get:
      tags: [persons]
      summary: 人物列表（检索 + 筛选）
      operationId: listPersons
      parameters:
        - name: q
          in: query
          description: 全文检索关键词（FTS5）
          schema: { type: string }
        - name: branch_id
          in: query
          schema: { type: string }
        - name: lineage_id
          in: query
          schema: { type: string }
        - name: generation_from
          in: query
          schema: { type: integer }
        - name: generation_to
          in: query
          schema: { type: integer }
        - name: gender
          in: query
          schema: { enum: [male, female, unknown] }
        - name: is_living
          in: query
          schema: { type: boolean }
        - name: has_citation
          in: query
          description: 是否挂有证据
          schema: { type: boolean }
        - name: birth_year_from
          in: query
          schema: { type: integer }
        - name: birth_year_to
          in: query
          schema: { type: integer }
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
      responses:
        "200": { $ref: "#/components/responses/Page" }
    post:
      tags: [persons]
      summary: 人物建档（可同时建立父母/配偶初始关系）
      operationId: createPerson
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PersonCreate" }
      responses:
        "201":
          description: 已创建
          headers:
            ETag: { $ref: "#/components/headers/ETag" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Person" }
        "400": { $ref: "#/components/responses/BadRequest" }

  /persons/{id}:
    parameters:
      - $ref: "#/components/parameters/Id"
    get:
      tags: [persons]
      summary: 人物详情（含关系、事件、证据展开）
      operationId: getPerson
      parameters:
        - name: expand
          in: query
          description: 展开子资源
          schema:
            type: array
            items:
              enum: [events, unions, citations, names, migrations]
          style: form
          explode: false
      responses:
        "200":
          description: 成功（在世者按隐私级别脱敏）
          headers:
            ETag: { $ref: "#/components/headers/ETag" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Person" }
        "404": { $ref: "#/components/responses/NotFound" }
    patch:
      tags: [persons]
      summary: 更新人物
      operationId: updatePerson
      parameters:
        - $ref: "#/components/parameters/IfMatch"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PersonUpdate" }
      responses:
        "200":
          description: 成功
          headers:
            ETag: { $ref: "#/components/headers/ETag" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Person" }
        "409": { $ref: "#/components/responses/Conflict" }
    delete:
      tags: [persons]
      summary: 删除人物（软删除，入 audit_log）
      operationId: deletePerson
      responses:
        "204": { description: 已删除 }

  /persons/{id}/ancestors:
    parameters:
      - $ref: "#/components/parameters/Id"
    get:
      tags: [lineage-algorithms]
      summary: 祖先链
      operationId: getPersonAncestors
      parameters:
        - name: depth
          in: query
          schema: { type: integer, default: 10, minimum: 1, maximum: 50 }
      responses:
        "200":
          description: 成功
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AncestorTree" }

  /persons/{id}/descendants:
    parameters:
      - $ref: "#/components/parameters/Id"
    get:
      tags: [lineage-algorithms]
      summary: 子孙树
      operationId: getPersonDescendants
      parameters:
        - name: depth
          in: query
          schema: { type: integer, default: 10, minimum: 1, maximum: 50 }
      responses:
        "200":
          description: 成功
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DescendantTree" }

  /persons/{id}/tree:
    parameters:
      - $ref: "#/components/parameters/Id"
    get:
      tags: [lineage-algorithms]
      summary: 世系图数据
      operationId: getPersonTree
      parameters:
        - name: mode
          in: query
          description: five_generation=五世一图传统版式；full=无限深度
          schema: { enum: [five_generation, full], default: full }
        - name: depth
          in: query
          description: full 模式有效
          schema: { type: integer, default: 10 }
      responses:
        "200":
          description: 成功
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LineageGraph" }

  /persons/{id}/mourning-degree:
    parameters:
      - $ref: "#/components/parameters/Id"
    get:
      tags: [lineage-algorithms]
      summary: 五服（丧服）计算
      operationId: getMourningDegree
      parameters:
        - name: to
          in: query
          required: true
          description: 对方人物 ID
          schema: { type: string }
        - name: ruleset
          in: query
          description: 礼制规则集。当前仅内置明清定型版；古代版与自定义版
            随规则数据文件（ADR-6）补齐后开放，届时无需改接口。
          schema: { enum: [ming_qing], default: ming_qing }
      responses:
        "200":
          description: 成功
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MourningDegree" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/Unprocessable" }

  /persons/{id}/appellation:
    parameters:
      - $ref: "#/components/parameters/Id"
    get:
      tags: [lineage-algorithms]
      summary: 亲属称谓计算
      operationId: getAppellation
      parameters:
        - name: to
          in: query
          required: true
          description: 对方人物 ID
          schema: { type: string }
      responses:
        "200":
          description: 成功
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Appellation" }
        "404": { $ref: "#/components/responses/NotFound" }

  /unions:
    get:
      tags: [unions]
      summary: 婚姻结合列表
      operationId: listUnions
      parameters:
        - name: person_id
          in: query
          schema: { type: string }
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
      responses:
        "200": { $ref: "#/components/responses/Page" }
    post:
      tags: [unions]
      summary: 建立婚姻/结合（含任次与角色）
      operationId: createUnion
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UnionCreate" }
      responses:
        "201":
          description: 已创建
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Union" }
        "400": { $ref: "#/components/responses/BadRequest" }

  /unions/{id}:
    parameters:
      - $ref: "#/components/parameters/Id"
    get:
      tags: [unions]
      summary: 结合详情
      operationId: getUnion
      responses:
        "200":
          description: 成功
          headers:
            ETag: { $ref: "#/components/headers/ETag" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Union" }
        "404": { $ref: "#/components/responses/NotFound" }
    patch:
      tags: [unions]
      summary: 更新结合（状态/任次/时间）
      operationId: updateUnion
      parameters:
        - $ref: "#/components/parameters/IfMatch"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                type: { enum: [marriage, concubinage, remarriage] }
                sequence: { type: integer }
                start_date: { $ref: "#/components/schemas/GenealogyDate" }
                end_date: { $ref: "#/components/schemas/GenealogyDate" }
                place_id: { type: string }
      responses:
        "200":
          description: 成功
          headers:
            ETag: { $ref: "#/components/headers/ETag" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Union" }
        "409": { $ref: "#/components/responses/Conflict" }
    delete:
      tags: [unions]
      summary: 解除结合（软删除）
      operationId: deleteUnion
      responses:
        "204": { description: 已删除 }

  /events:
    get:
      tags: [events]
      summary: 事件列表
      operationId: listEvents
      parameters:
        - name: subject_type
          in: query
          schema: { enum: [person, union, branch, lineage] }
        - name: subject_id
          in: query
          schema: { type: string }
        - name: type
          in: query
          schema: { $ref: "#/components/schemas/EventType" }
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
      responses:
        "200": { $ref: "#/components/responses/Page" }
    post:
      tags: [events]
      summary: 登记事件
      operationId: createEvent
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/EventCreate" }
      responses:
        "201":
          description: 已创建
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Event" }

  /events/{id}:
    parameters:
      - $ref: "#/components/parameters/Id"
    get:
      tags: [events]
      summary: 事件详情
      operationId: getEvent
      responses:
        "200":
          description: 成功
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Event" }
        "404": { $ref: "#/components/responses/NotFound" }
    delete:
      tags: [events]
      summary: 删除事件
      operationId: deleteEvent
      responses:
        "204": { description: 已删除 }

  /places:
    get:
      tags: [places]
      summary: 地点列表（历史地名 ↔ 现代政区）
      operationId: listPlaces
      parameters:
        - name: q
          in: query
          schema: { type: string }
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
      responses:
        "200": { $ref: "#/components/responses/Page" }
    post:
      tags: [places]
      summary: 创建地点
      operationId: createPlace
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PlaceCreate" }
      responses:
        "201":
          description: 已创建
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Place" }

  /places/{id}:
    parameters:
      - $ref: "#/components/parameters/Id"
    get:
      tags: [places]
      summary: 地点详情
      operationId: getPlace
      responses:
        "200":
          description: 成功
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Place" }
        "404": { $ref: "#/components/responses/NotFound" }
    patch:
      tags: [places]
      summary: 更新地点（地点表无 rev，不走乐观锁）
      operationId: updatePlace
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PlaceUpdate" }
      responses:
        "200":
          description: 成功
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Place" }
        "404": { $ref: "#/components/responses/NotFound" }
    delete:
      tags: [places]
      summary: 删除地点
      operationId: deletePlace
      responses:
        "204": { description: 已删除 }

  /search:
    get:
      tags: [search-stats]
      summary: 全文 + 结构化检索
      operationId: search
      parameters:
        - name: q
          in: query
          schema: { type: string }
        - name: scope
          in: query
          description: |
            检索范围。当前仅 person 与 all 可用（document/source 的
            模型随 M5 证据链补齐后开放，届时无需改接口形态）。
          schema: { enum: [person, all], default: all }
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
      responses:
        "200": { $ref: "#/components/responses/Page" }

  /stats:
    get:
      tags: [search-stats]
      summary: 统计
      operationId: getStats
      responses:
        "200":
          description: 成功
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Stats" }

  /validate:
    post:
      tags: [validate]
      summary: 运行校验规则
      operationId: runValidation
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                rule_ids:
                  type: array
                  items: { type: string }
      responses:
        "200":
          description: 校验完成
          content:
            application/json:
              schema:
                type: object
                properties:
                  issues:
                    type: array
                    items: { $ref: "#/components/schemas/ValidationIssue" }
                  summary:
                    type: object
                    properties:
                      error: { type: integer }
                      warning: { type: integer }
                      info: { type: integer }

  /imports/gedcom:
    post:
      tags: [import-export]
      summary: GEDCOM 导入
      operationId: importGedcom
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file: { type: string, format: binary }
                lineage_id: { type: string }
      responses:
        "200":
          description: 导入完成（含映射损失报告）
          content:
            application/json:
              schema:
                type: object
                properties:
                  imported: { type: integer }
                  skipped: { type: integer }
                  warnings:
                    type: array
                    items: { type: string }

  /exports/gedcom:
    get:
      tags: [import-export]
      summary: GEDCOM 导出
      operationId: exportGedcom
      parameters:
        - name: lineage_id
          in: query
          required: true
          schema: { type: string }
      responses:
        "200":
          description: GEDCOM 文件
          content:
            text/plain:
              schema: { type: string }

  /exports/tree:
    get:
      tags: [import-export]
      summary: 世系图导出
      operationId: exportTree
      parameters:
        - name: person_id
          in: query
          required: true
          schema: { type: string }
        - name: format
          in: query
          description: dot / mermaid 直接可用；svg 需 graphviz，后续开放
          schema: { enum: [dot, mermaid] }
      responses:
        "200":
          description: 图文件
          content:
            text/plain:
              schema: { type: string }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  parameters:
    Id:
      name: id
      in: path
      required: true
      schema: { type: string }
    Limit:
      name: limit
      in: query
      schema: { type: integer, default: 50, minimum: 1, maximum: 200 }
    Cursor:
      name: cursor
      in: query
      schema: { type: string }
    # If-Match 是**请求头参数**，必须放 parameters 段并带 name/in——
    # 曾经误放在 headers 段（那是响应头的段），从 parameters 引用它时
    # 解析出来的对象没有 name/in，元 schema 校验直接失败。
    # 语义见 5.2.1：写操作必须带 If-Match（当前 rev），缺失 428，不符 409。
    IfMatch:
      name: If-Match
      in: header
      required: true
      description: 期望的实体版本（当前 rev），不匹配返回 409
      schema: { type: string }

  headers:
    ETag:
      description: 实体版本（rev）
      schema: { type: string }

  responses:
    Page:
      description: 分页列表
      content:
        application/json:
          schema:
            type: object
            properties:
              data:
                type: array
                items: { type: object }
              page:
                type: object
                properties:
                  next_cursor: { type: [string, "null"] }
                  has_more: { type: boolean }
    BadRequest:
      description: 参数校验失败（code 1001）
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
    Unauthorized:
      description: 未认证（code 3001）
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
    NotFound:
      description: 资源不存在（code 2001）
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
    Conflict:
      description: 版本冲突（code 2009）
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
    Unprocessable:
      description: 领域规则不满足（如历法超出 1900-2100，code 5001）
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }

  schemas:
    Role:
      type: string
      enum: [steward, editor, viewer]

    GenealogyDate:
      type: object
      properties:
        calendar: { enum: [gregorian, lunar], default: gregorian }
        gregorian: { type: string, format: date }
        lunar: { type: string, description: 谱面原文 }
        ganzhi: { type: string }
        era:
          type: object
          properties:
            name: { type: string }
            year: { type: integer }
        precision: { enum: [day, month, year, decade, fuzzy], default: day }
        qualifier: { type: string, description: "约/以前/以后" }
      examples:
        - calendar: lunar
          lunar: "同治三年四月初四"
          gregorian: "1864-05-09"
          era: { name: "同治", year: 3 }
          precision: day

    Person:
      type: object
      properties:
        id: { type: string }
        lineage_id: { type: string }
        branch_id: { type: string }
        family_name: { type: string }
        given_name: { type: string }
        courtesy_name: { type: string, description: 字 }
        art_name: { type: string, description: 号 }
        posthumous_title: { type: string }
        gender: { enum: [male, female, unknown] }
        generation_no: { type: integer }
        birth_order: { type: integer, description: 行几 }
        is_heir: { type: boolean, description: 承重/嫡嗣 }
        is_living: { type: boolean }
        privacy_level: { enum: [public, kin, private] }
        birth_date: { $ref: "#/components/schemas/GenealogyDate" }
        death_date: { $ref: "#/components/schemas/GenealogyDate" }
        burial_place_id: { type: string }
        biography: { type: string }
        father_id: { type: string }
        mother_id: { type: string }
        portrait_attachment_id: { type: string }
        rev: { type: integer }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
        _links:
          type: object
          additionalProperties: { type: string }

    PersonCreate:
      type: object
      required: [lineage_id, family_name, given_name, gender]
      properties:
        lineage_id: { type: string }
        branch_id: { type: string }
        family_name: { type: string }
        given_name: { type: string }
        courtesy_name: { type: string }
        gender: { enum: [male, female, unknown] }
        generation_no: { type: integer }
        birth_order: { type: integer }
        is_heir: { type: boolean }
        is_living: { type: boolean }
        birth_date: { $ref: "#/components/schemas/GenealogyDate" }
        death_date: { $ref: "#/components/schemas/GenealogyDate" }
        biography: { type: string }
        father_id: { type: string }
        mother_id: { type: string }

    PersonUpdate:
      type: object
      properties:
        branch_id: { type: string }
        courtesy_name: { type: string }
        generation_no: { type: integer }
        birth_order: { type: integer }
        birth_date: { $ref: "#/components/schemas/GenealogyDate" }
        death_date: { $ref: "#/components/schemas/GenealogyDate" }
        biography: { type: string }
        is_living: { type: boolean }
        privacy_level: { enum: [public, kin, private] }

    Lineage:
      type: object
      properties:
        id: { type: string }
        name: { type: string }
        surname: { type: string }
        surname_origin: { type: string }
        commandery: { type: string }
        hall_name: { type: string }
        generation_poem: { type: string }
        rev: { type: integer }

    LineageCreate:
      type: object
      required: [name, surname]
      properties:
        name: { type: string }
        surname: { type: string }
        surname_origin: { type: string }
        commandery: { type: string }
        hall_name: { type: string }
        generation_poem: { type: string }

    LineageUpdate:
      type: object
      properties:
        name: { type: string }
        surname_origin: { type: string }
        commandery: { type: string }
        hall_name: { type: string }
        generation_poem: { type: string }

    Branch:
      type: object
      properties:
        id: { type: string }
        lineage_id: { type: string }
        name: { type: string }
        founder_person_id: { type: string }
        parent_branch_id: { type: string }
        generation_char: { type: string }
        rev: { type: integer }

    BranchCreate:
      type: object
      required: [lineage_id, name]
      properties:
        lineage_id: { type: string }
        name: { type: string }
        founder_person_id: { type: string }
        parent_branch_id: { type: string }
        generation_char: { type: string }

    BranchNode:
      type: object
      properties:
        id: { type: string }
        name: { type: string }
        generation_char: { type: string }
        children:
          type: array
          items: { $ref: "#/components/schemas/BranchNode" }

    Union:
      type: object
      properties:
        id: { type: string }
        type: { enum: [marriage, concubinage, remarriage] }
        status: { enum: [active, dissolved] }
        sequence: { type: integer }
        start_date: { $ref: "#/components/schemas/GenealogyDate" }
        end_date: { $ref: "#/components/schemas/GenealogyDate" }
        place_id: { type: string }
        members:
          type: array
          items:
            type: object
            properties:
              person_id: { type: string }
              role: { enum: [husband, wife, concubine] }
        rev: { type: integer }

    UnionCreate:
      type: object
      required: [type, members]
      properties:
        type: { enum: [marriage, concubinage, remarriage] }
        sequence: { type: integer }
        start_date: { $ref: "#/components/schemas/GenealogyDate" }
        place_id: { type: string }
        members:
          type: array
          minItems: 2
          items:
            type: object
            required: [person_id, role]
            properties:
              person_id: { type: string }
              role: { enum: [husband, wife, concubine] }

    EventType:
      type: string
      enum: [birth, death, burial, marriage, migration, examination, office,
             honor, residence, annotation]

    Event:
      type: object
      properties:
        id: { type: string }
        subject_type: { enum: [person, union, branch, lineage] }
        subject_id: { type: string }
        type: { $ref: "#/components/schemas/EventType" }
        date: { $ref: "#/components/schemas/GenealogyDate" }
        place_id: { type: string }
        description: { type: string }

    EventCreate:
      type: object
      required: [subject_type, subject_id, type]
      properties:
        subject_type: { enum: [person, union, branch, lineage] }
        subject_id: { type: string }
        type: { $ref: "#/components/schemas/EventType" }
        date: { $ref: "#/components/schemas/GenealogyDate" }
        place_id: { type: string }
        description: { type: string }

    Place:
      type: object
      properties:
        id: { type: string }
        name: { type: string }
        type:
          enum: [village, town, county, prefecture, province, grave, ancestral_hall, other]
        modern_admin: { type: string }
        historical_name: { type: string }
        lat: { type: number }
        lng: { type: number }

    PlaceCreate:
      type: object
      required: [name]
      properties:
        name: { type: string }
        type:
          enum: [village, town, county, prefecture, province, grave, ancestral_hall, other]
        modern_admin: { type: string }
        historical_name: { type: string }
        lat: { type: number }
        lng: { type: number }

    PlaceUpdate:
      type: object
      description: 地点表无 rev，不走乐观锁；type 建档后不可改
      properties:
        name: { type: string }
        modern_admin: { type: string }
        historical_name: { type: string }
        lat: { type: number }
        lng: { type: number }

    MourningDegree:
      type: object
      properties:
        # garment 取值 = shared/rules/mourning_*.json 里 grades 的 id，
        # 客户端可据此做本地化；不要按数组顺序推断等级高低。
        garment:
          enum: [zhancui, qicui_zhang, qicui_buzhang, qicui_wuyue,
                 qicui_sanyue, dagong, xiaogong, sima, tanmian, wufu]
        garment_name: { type: string }
        duration_months: { type: integer }
        rule_id:
          type: string
          description: 命中的规则标识（规则表的 path 步骤序列）；
            兜底推断时为 "fallback"。
        ruleset: { enum: [ming_qing] }
        basis: { type: string }

    Appellation:
      type: object
      properties:
        standard: { type: string }
        colloquial: { type: string }
        formal: { type: string }
        elder: { type: boolean }
        path:
          type: array
          items: { type: string }

    AncestorTree:
      type: object
      properties:
        person: { $ref: "#/components/schemas/Person" }
        generations:
          type: array
          items:
            type: object
            properties:
              depth: { type: integer }
              persons:
                type: array
                items: { $ref: "#/components/schemas/Person" }

    DescendantTree:
      type: object
      properties:
        person: { $ref: "#/components/schemas/Person" }
        children:
          type: array
          items: { $ref: "#/components/schemas/DescendantTree" }

    LineageGraph:
      type: object
      description: 世系图数据（节点 + 边，客户端自绘）
      properties:
        mode: { enum: [five_generation, full] }
        nodes:
          type: array
          items: { $ref: "#/components/schemas/Person" }
        edges:
          type: array
          items:
            type: object
            properties:
              from: { type: string }
              to: { type: string }
              type: { enum: [birth, adoption, marriage] }

    Stats:
      type: object
      properties:
        person_count: { type: integer }
        event_count: { type: integer }
        branch_count:
          type: integer
          description: 支派统计暂恒 0（按宗族拆分随 M5 lineage 维度补齐）
        living_count: { type: integer }
        uncited_facts:
          type: integer
          description: 无证据事实数（数据质量核心指标）；
            当前无 Source/Citation 模型，恒 0（M5 证据链补齐后生效）
        generation_distribution:
          type: array
          items:
            type: object
            properties:
              generation_no: { type: integer }
              count: { type: integer }

    ValidationIssue:
      type: object
      properties:
        rule_id: { type: string }
        severity: { enum: [error, warning, info] }
        entity_type: { type: string }
        entity_id: { type: string }
        message: { type: string }
        suggestion: { type: string }

    Problem:
      type: object
      properties:
        type: { type: string, format: uri }
        title: { type: string }
        status: { type: integer }
        detail: { type: string }
        code: { type: integer }
        instance: { type: string }
        errors:
          type: array
          items:
            type: object
            properties:
              field: { type: string }
              message: { type: string }

# ---------------------------------------------------------------- 路线图
# 以下端点族 schema 表已在 M0 建好（shared/schema），但 core 领域模型与
# REST 实现属于 M5 交付范围（设计文档里程碑表：M5 多客户端外接 =
# Web UI 参考实现、SSE 协同、迁徙地图）。本规范为「已实现能力」定稿，
# 规划端点不进入 paths——声明了却返回 501/404 的端点比没有更坏：
# 第三方按 spec 开发必然踩空。M5 实现时同步加回 paths 与 schemas。
x-roadmap:
  planned_paths:
    - /persons/{id}/names        # 名号变更（谱名/乳名/学名/改后名），M5
    - /migrations                # 迁徙登记 + 迁徙地图数据，M5
    - /sources                   # 文献来源，M5 证据链
    - /citations                 # 事实↔证据挂接，M5 证据链
    - /documents                 # 谱序/凡例/家训/艺文/契约，M5
    - /attachments               # 遗像/扫描件上传下载（内容寻址），M5
    - /events/stream             # SSE 多端协同（本地单机可不启用），M5
  planned_schemas:
    - PersonName
    - PersonNameCreate
    - Migration
    - MigrationCreate
    - Source
    - SourceType
    - SourceCreate
    - Citation
    - CitationCreate
    - Document
    - DocumentCreate
    - Attachment
