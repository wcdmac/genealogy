openapi: 3.1.0
info:
  title: Genealogy API
  version: 1.0.0
  description: |
    家谱管理软件对外开放 API。核心逻辑由 C++ (libgenealogy-core) 实现，
    本规范为客户端代码生成的唯一事实源。

    通用约定：
    - 所有 ID 为 ULID（26 字符，字典序可排序）。
    - 日期统一使用 GenealogyDate 复合对象（公历/农历/年号/干支/精度），
      禁止使用裸日期字符串。
    - 列表端点使用游标分页（limit + cursor）。
    - PATCH 写操作必须带 If-Match 乐观并发：缺失返回 428，版本不符返回
      409（地点表无 rev，PATCH /places/{id} 豁免；POST/DELETE 不带
      If-Match）。
    - POST 写端点支持可选 Idempotency-Key 头（M8.1）：24h 内同 key 重放
      返回首次结果（响应带 Idempotency-Replayed: true），不重复建档；
      仅 2xx 入缓存，失败响应可修正后重试。key 缺失直接执行。
    - 限流（M8.2）：每客户端 60 req/min 令牌桶（env
      GENEALOGY_RATE_LIMIT 覆盖；/health 与 OPTIONS 豁免）。超限返回
      429 + Retry-After + X-RateLimit-Limit/Remaining/Reset；正常响应
      亦带 X-RateLimit-* 头。
    - 写操作全部入审计（M8.5）：actor/action/at/diff 可经 GET /audit
      按实体回溯（仅 steward——diff 含原始数据）。
    - 错误使用 application/problem+json（RFC 9457）。
  license:
    name: MIT

x-cross-cutting-responses: >-
  全局横切响应（不逐 operation 重复声明）：415 UnsupportedMediaType
  （请求体守卫，multipart 仅 /imports/gedcom 消费）；429 RateLimited
  （按 IP 令牌桶，Retry-After 动态计算）。引用见 components/responses。
servers:
  - url: http://127.0.0.1:8080/api/v1
    description: 本地模式（默认）
  - url: https://{host}/api/v1
    description: 服务端模式
    variables:
      host:
        default: genealogy.example.com

security:
  - bearerAuth: []

tags:
  - name: auth
  - name: lineages
  - name: branches
  - name: persons
  - name: lineage-algorithms
  - name: unions
  - name: events
  - name: migrations
    description: 迁徙登记与迁徙地图数据源
  - name: places
  - name: sources
    description: 文献来源（M7.2）
  - name: citations
    description: 事实↔证据挂接（M7.2）
  - name: documents
    description: 谱序/凡例/族规家训/艺文/契约（M7.4，正文 trigram FTS 检索）
  - name: names
    description: 名号变更史（M7.1，一人多名：谱名/乳名/学名/改后名/身后名）
  - name: attachments
    description: 附件（规划中，M5；见根级 x-roadmap）
  - name: search-stats
  - name: validate
  - name: import-export

paths:
  /auth/token:
    post:
      tags: [auth]
      summary: 登录获取 JWT
      operationId: issueToken
      # 令牌签发入口本身匿名可达（口令在 body 里）；全局 bearerAuth
      # 不适用于本端点，否则生成的客户端会给登录请求强加 Bearer 头。
      security: []
      description: >-
        两种模式：本地免鉴权（默认）任意 body（可空）即发本地 steward
        令牌，username/role 自选——这是单机便捷通道；--require-auth 模式
        要求 username 与 password，口令对上 GENEALOGY_AUTH_PASSWORD 才
        发令牌（口令即全权 steward；单机/局域网工具，无速率限制与
        防爆破，用户模型与 ACL 属 M3/M8 路线图）。
      requestBody:
        # 本地模式允许空 body（便捷通道，见 description）；--require-auth
        # 模式下 username/password 缺失返回 400。
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                username: { type: string }
                password: { type: string, format: password }
                role:
                  description: >-
                    请求的角色（steward/editor/viewer）。本地模式生效；
                    当前实现没有按角色收敛权限的 ACL（M8.4），角色信息
                    只进令牌与 /me。
                  $ref: "#/components/schemas/Role"
      responses:
        "200":
          description: 成功
          content:
            application/json:
              schema:
                type: object
                properties:
                  access_token: { type: string }
                  token_type: { type: string, const: Bearer }
                  expires_in: { type: integer }
                  role: { $ref: "#/components/schemas/Role" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /me:
    get:
      tags: [auth]
      summary: 当前用户与角色
      operationId: getCurrentUser
      responses:
        "200":
          description: 成功
          content:
            application/json:
              schema:
                type: object
                properties:
                  username: { type: string }
                  role: { $ref: "#/components/schemas/Role" }
                  lineage_ids:
                    type: array
                    items: { type: string }

  /health:
    get:
      tags: [auth]
      summary: 探活（顺带验证数据库可用）
      operationId: health
      responses:
        "200":
          description: 成功
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { enum: [ok, degraded] }
                  version: { type: string }

  /lineages:
    get:
      tags: [lineages]
      summary: 宗族列表
      operationId: listLineages
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
      responses:
        "200": { $ref: "#/components/responses/Page" }
    post:
      tags: [lineages]
      summary: 创建宗族
      operationId: createLineage
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/LineageCreate" }
      responses:
        "201":
          description: 已创建
          headers:
            ETag: { $ref: "#/components/headers/ETag" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Lineage" }
        "400": { $ref: "#/components/responses/BadRequest" }

  /lineages/{id}:
    parameters:
      - $ref: "#/components/parameters/Id"
    get:
      tags: [lineages]
      summary: 宗族详情
      operationId: getLineage
      responses:
        "200":
          description: 成功
          headers:
            ETag: { $ref: "#/components/headers/ETag" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Lineage" }
        "404": { $ref: "#/components/responses/NotFound" }
    patch:
      tags: [lineages]
      summary: 更新宗族
      operationId: updateLineage
      parameters:
        - $ref: "#/components/parameters/IfMatch"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/LineageUpdate" }
      responses:
        "200":
          description: 成功
          headers:
            ETag: { $ref: "#/components/headers/ETag" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Lineage" }
        "409": { $ref: "#/components/responses/Conflict" }
        "428": { $ref: "#/components/responses/PreconditionRequired" }
    delete:
      tags: [lineages]
      summary: 删除宗族
      operationId: deleteLineage
      responses:
        "204": { description: 已删除 }

  /branches:
    get:
      tags: [branches]
      summary: 支派列表
      operationId: listBranches
      parameters:
        - name: lineage_id
          in: query
          schema: { type: string }
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
      responses:
        "200": { $ref: "#/components/responses/Page" }
    post:
      tags: [branches]
      summary: 创建支派/房
      operationId: createBranch
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/BranchCreate" }
      responses:
        "201":
          description: 已创建
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Branch" }

  /branches/{id}:
    parameters:
      - $ref: "#/components/parameters/Id"
    get:
      tags: [branches]
      summary: 支派详情
      operationId: getBranch
      responses:
        "200":
          description: 成功
          headers:
            ETag: { $ref: "#/components/headers/ETag" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Branch" }
        "404": { $ref: "#/components/responses/NotFound" }
    patch:
      tags: [branches]
      summary: 更新支派
      operationId: updateBranch
      parameters:
        - $ref: "#/components/parameters/IfMatch"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: string }
                founder_person_id: { type: string }
                parent_branch_id: { type: string }
                generation_char: { type: string }
      responses:
        "200":
          description: 成功
          headers:
            ETag: { $ref: "#/components/headers/ETag" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Branch" }
        "409": { $ref: "#/components/responses/Conflict" }
        "428": { $ref: "#/components/responses/PreconditionRequired" }
    delete:
      tags: [branches]
      summary: 删除支派
      operationId: deleteBranch
      responses:
        "204": { description: 已删除 }

  /branches/{id}/tree:
    parameters:
      - $ref: "#/components/parameters/Id"
    get:
      tags: [branches]
      summary: 支派树
      operationId: getBranchTree
      responses:
        "200":
          description: 成功
          content:
            application/json:
              schema:
                type: object
                properties:
                  root: { $ref: "#/components/schemas/BranchNode" }

  /persons:
    get:
      tags: [persons]
      summary: 人物列表（检索 + 筛选）
      operationId: listPersons
      parameters:
        - name: q
          in: query
          description: 全文检索关键词（FTS5）
          schema: { type: string }
        - name: branch_id
          in: query
          schema: { type: string }
        - name: lineage_id
          in: query
          schema: { type: string }
        - name: generation_from
          in: query
          schema: { type: integer }
        - name: generation_to
          in: query
          schema: { type: integer }
        - name: gender
          in: query
          schema: { enum: [male, female, unknown] }
        - name: is_living
          in: query
          schema: { type: boolean }
        - name: has_citation
          in: query
          description: 是否挂有证据
          schema: { type: boolean }
        - name: birth_year_from
          in: query
          schema: { type: integer }
        - name: birth_year_to
          in: query
          schema: { type: integer }
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
      responses:
        "200": { $ref: "#/components/responses/Page" }
    post:
      tags: [persons]
      summary: 人物建档（可同时建立父母/配偶初始关系）
      operationId: createPerson
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PersonCreate" }
      responses:
        "201":
          description: 已创建
          headers:
            ETag: { $ref: "#/components/headers/ETag" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Person" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }

  /persons/{id}:
    parameters:
      - $ref: "#/components/parameters/Id"
    get:
      tags: [persons]
      summary: 人物详情（含关系、事件、证据展开）
      operationId: getPerson
      parameters:
        - name: expand
          in: query
          description: >-
            展开子资源（逗号分隔）：events 事件、unions 参与的结合、
            migrations 迁徙记录，随响应以同名字段返回。
            citations/names 等证据链子资源属 M7（schema 已建、域模型未建），
            实现后加入本枚举。
          schema:
            type: array
            items:
              enum: [events, unions, migrations]
          style: form
          explode: false
      responses:
        "200":
          description: 成功（privacy_level 为声明式标记；在世者脱敏属隐私合规规划项，尚未实现，见 x-roadmap）
          headers:
            ETag: { $ref: "#/components/headers/ETag" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Person" }
        "404": { $ref: "#/components/responses/NotFound" }
    patch:
      tags: [persons]
      summary: 更新人物
      operationId: updatePerson
      parameters:
        - $ref: "#/components/parameters/IfMatch"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PersonUpdate" }
      responses:
        "200":
          description: 成功
          headers:
            ETag: { $ref: "#/components/headers/ETag" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Person" }
        "409": { $ref: "#/components/responses/Conflict" }
        "428": { $ref: "#/components/responses/PreconditionRequired" }
    delete:
      tags: [persons]
      summary: 删除人物（硬删除；其事件与迁徙随主体一并删除）
      operationId: deletePerson
      responses:
        "204": { description: 已删除 }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }

  /persons/{id}/ancestors:
    parameters:
      - $ref: "#/components/parameters/Id"
    get:
      tags: [lineage-algorithms]
      summary: 祖先链
      operationId: getPersonAncestors
      parameters:
        - name: depth
          in: query
          schema: { type: integer, default: 10, minimum: 1, maximum: 50 }
      responses:
        "200":
          description: 成功
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AncestorTree" }

  /persons/{id}/descendants:
    parameters:
      - $ref: "#/components/parameters/Id"
    get:
      tags: [lineage-algorithms]
      summary: 子孙树
      operationId: getPersonDescendants
      parameters:
        - name: depth
          in: query
          schema: { type: integer, default: 10, minimum: 1, maximum: 50 }
      responses:
        "200":
          description: 成功
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DescendantTree" }

  /persons/{id}/tree:
    parameters:
      - $ref: "#/components/parameters/Id"
    get:
      tags: [lineage-algorithms]
      summary: 世系图数据
      operationId: getPersonTree
      parameters:
        - name: mode
          in: query
          description: five_generation=五世一图传统版式；full=无限深度
          schema: { enum: [five_generation, full], default: full }
        - name: depth
          in: query
          description: full 模式有效
          schema: { type: integer, default: 10 }
      responses:
        "200":
          description: 成功
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LineageGraph" }

  /persons/{id}/mourning-degree:
    parameters:
      - $ref: "#/components/parameters/Id"
    get:
      tags: [lineage-algorithms]
      summary: 五服（丧服）计算
      operationId: getMourningDegree
      parameters:
        - name: to
          in: query
          required: true
          description: 对方人物 ID
          schema: { type: string }
        - name: ruleset
          in: query
          description: 礼制规则集。当前仅内置明清定型版；古代版与自定义版
            随规则数据文件（ADR-6）补齐后开放，届时无需改接口。
          schema: { enum: [ming_qing], default: ming_qing }
      responses:
        "200":
          description: 成功
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MourningDegree" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/Unprocessable" }

  /persons/{id}/appellation:
    parameters:
      - $ref: "#/components/parameters/Id"
    get:
      tags: [lineage-algorithms]
      summary: 亲属称谓计算
      operationId: getAppellation
      parameters:
        - name: to
          in: query
          required: true
          description: 对方人物 ID
          schema: { type: string }
      responses:
        "200":
          description: 成功
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Appellation" }
        "404": { $ref: "#/components/responses/NotFound" }

  /unions:
    get:
      tags: [unions]
      summary: 婚姻结合列表
      operationId: listUnions
      parameters:
        - name: person_id
          in: query
          schema: { type: string }
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
      responses:
        "200": { $ref: "#/components/responses/Page" }
    post:
      tags: [unions]
      summary: 建立婚姻/结合（含任次与角色）
      operationId: createUnion
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UnionCreate" }
      responses:
        "201":
          description: 已创建
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Union" }
        "400": { $ref: "#/components/responses/BadRequest" }

  /unions/{id}:
    parameters:
      - $ref: "#/components/parameters/Id"
    get:
      tags: [unions]
      summary: 结合详情
      operationId: getUnion
      responses:
        "200":
          description: 成功
          headers:
            ETag: { $ref: "#/components/headers/ETag" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Union" }
        "404": { $ref: "#/components/responses/NotFound" }
    patch:
      tags: [unions]
      summary: 更新结合（状态/任次/时间）
      operationId: updateUnion
      parameters:
        - $ref: "#/components/parameters/IfMatch"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                type: { enum: [marriage, concubinage, remarriage] }
                sequence: { type: integer }
                start_date: { $ref: "#/components/schemas/GenealogyDate" }
                end_date: { $ref: "#/components/schemas/GenealogyDate" }
                place_id: { type: string }
      responses:
        "200":
          description: 成功
          headers:
            ETag: { $ref: "#/components/headers/ETag" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Union" }
        "409": { $ref: "#/components/responses/Conflict" }
        "428": { $ref: "#/components/responses/PreconditionRequired" }
    delete:
      tags: [unions]
      summary: 解除结合（删除结合及成员关联）
      operationId: deleteUnion
      responses:
        "204": { description: 已删除 }

  /sources:
    get:
      tags: [sources]
      summary: 来源列表（按类型/标题过滤）
      operationId: listSources
      parameters:
        - name: type
          in: query
          schema:
            enum: [genealogy_book, local_gazetteer, stele, oral, archive,
                   photo, dna, document, other]
        - name: q
          in: query
          description: 标题模糊匹配
          schema: { type: string }
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
      responses:
        "200":
          description: 成功
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: "#/components/schemas/Source" }
                  page:
                    type: object
                    properties:
                      next_cursor: { type: [string, "null"] }
                      has_more: { type: boolean }
    post:
      tags: [sources]
      summary: 登记来源（谱册/碑刻/口述/档案等）
      operationId: createSource
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SourceCreate" }
      responses:
        "201":
          description: 成功
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Source" }
        "400": { $ref: "#/components/responses/BadRequest" }

  /sources/{id}:
    parameters:
      - $ref: "#/components/parameters/Id"
    get:
      tags: [sources]
      summary: 来源详情
      operationId: getSource
      responses:
        "200":
          description: 成功
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Source" }
        "404": { $ref: "#/components/responses/NotFound" }
    patch:
      tags: [sources]
      summary: 更新来源
      operationId: updateSource
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SourceCreate" }
      responses:
        "200":
          description: 成功
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Source" }
        "404": { $ref: "#/components/responses/NotFound" }
    delete:
      tags: [sources]
      summary: 删除来源（被引用时 409）
      operationId: deleteSource
      responses:
        "204": { description: 已删除 }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }

  /citations:
    get:
      tags: [citations]
      summary: 证据引用列表（按主体/来源过滤）
      operationId: listCitations
      parameters:
        - name: subject_type
          in: query
          schema: { enum: [person, event, union, migration, branch, lineage] }
        - name: subject_id
          in: query
          schema: { type: string }
        - name: source_id
          in: query
          schema: { type: string }
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
      responses:
        "200":
          description: 成功
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: "#/components/schemas/Citation" }
                  page:
                    type: object
                    properties:
                      next_cursor: { type: [string, "null"] }
                      has_more: { type: boolean }
    post:
      tags: [citations]
      summary: 登记证据引用（主体与来源都必须已存在）
      operationId: createCitation
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CitationCreate" }
      responses:
        "201":
          description: 成功
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Citation" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }

  /citations/{id}:
    parameters:
      - $ref: "#/components/parameters/Id"
    get:
      tags: [citations]
      summary: 证据引用详情
      operationId: getCitation
      responses:
        "200":
          description: 成功
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Citation" }
        "404": { $ref: "#/components/responses/NotFound" }
    patch:
      tags: [citations]
      summary: 更新证据引用
      operationId: updateCitation
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CitationCreate" }
      responses:
        "200":
          description: 成功
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Citation" }
        "404": { $ref: "#/components/responses/NotFound" }
    delete:
      tags: [citations]
      summary: 解除证据引用
      operationId: deleteCitation
      responses:
        "204": { description: 已删除 }
        "404": { $ref: "#/components/responses/NotFound" }

  /documents:
    get:
      tags: [documents]
      summary: 文档列表（谱序/凡例/族规家训/艺文/契约）
      operationId: listDocuments
      parameters:
        - name: type
          in: query
          schema:
            enum: [preface, rule, regulation, literature, contract,
                   edition_note]
        - name: lineage_id
          in: query
          schema: { type: string }
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
      responses:
        "200":
          description: 成功
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: "#/components/schemas/Document" }
                  page:
                    type: object
                    properties:
                      next_cursor: { type: [string, "null"] }
                      has_more: { type: boolean }
    post:
      tags: [documents]
      summary: 登记文档（lineage 须存在，title 必填）
      operationId: createDocument
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/DocumentCreate" }
      responses:
        "201":
          description: 已创建
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Document" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }

  /documents/{id}:
    parameters:
      - $ref: "#/components/parameters/Id"
    get:
      tags: [documents]
      summary: 文档详情
      operationId: getDocument
      responses:
        "200":
          description: 成功
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Document" }
        "404": { $ref: "#/components/responses/NotFound" }
    patch:
      tags: [documents]
      summary: 更新文档（merge 语义：absent=保留——content 是大段正文，防误清）
      operationId: updateDocument
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/DocumentCreate" }
      responses:
        "200":
          description: 已更新
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Document" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }
    delete:
      tags: [documents]
      summary: 删除文档（document 不入 citation 主体，无 409 保护）
      operationId: deleteDocument
      responses:
        "204": { description: 已删除 }
        "404": { $ref: "#/components/responses/NotFound" }

  /persons/{id}/names:
    parameters:
      - $ref: "#/components/parameters/Id"
    get:
      tags: [names]
      summary: 名号列表（主名在前；人物不存在 404）
      operationId: listPersonNames
      responses:
        "200":
          description: 成功
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: "#/components/schemas/PersonName" }
                  page:
                    type: object
                    properties:
                      next_cursor: { type: [string, "null"] }
                      has_more: { type: boolean }
    post:
      tags: [names]
      summary: 登记名号（置主时清除同人多条；人物不存在 404）
      operationId: createPersonName
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PersonNameCreate" }
      responses:
        "201":
          description: 已创建
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PersonName" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }

  /persons/{id}/names/{nameId}:
    parameters:
      - $ref: "#/components/parameters/Id"
      - name: nameId
        in: path
        required: true
        schema: { type: string }
    delete:
      tags: [names]
      summary: 删除名号（台账语义：修正=删了重录）
      operationId: deletePersonName
      responses:
        "204": { description: 已删除 }
        "404": { $ref: "#/components/responses/NotFound" }

  /events:
    get:
      tags: [events]
      summary: 事件列表
      operationId: listEvents
      parameters:
        - name: subject_type
          in: query
          schema: { enum: [person, union, branch, lineage] }
        - name: subject_id
          in: query
          schema: { type: string }
        - name: type
          in: query
          schema: { $ref: "#/components/schemas/EventType" }
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
      responses:
        "200": { $ref: "#/components/responses/Page" }
    post:
      tags: [events]
      summary: 登记事件
      operationId: createEvent
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/EventCreate" }
      responses:
        "201":
          description: 已创建
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Event" }

  /events/{id}:
    parameters:
      - $ref: "#/components/parameters/Id"
    get:
      tags: [events]
      summary: 事件详情
      operationId: getEvent
      responses:
        "200":
          description: 成功
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Event" }
        "404": { $ref: "#/components/responses/NotFound" }
    delete:
      tags: [events]
      summary: 删除事件
      operationId: deleteEvent
      responses:
        "204": { description: 已删除 }

  /migrations:
    get:
      tags: [migrations]
      summary: 迁徙列表
      operationId: listMigrations
      parameters:
        - name: branch_id
          in: query
          description: 支派 ID——返回该支派自身的迁徙及其成员个人的迁徙
          schema: { type: string }
        - name: subject_id
          in: query
          description: 按主体精确查（与 branch_id 二选一）
          schema: { type: string }
        - name: subject_type
          in: query
          schema: { enum: [person, branch] }
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
      responses:
        "200": { $ref: "#/components/responses/Page" }
    post:
      tags: [migrations]
      summary: 登记迁徙
      operationId: createMigration
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/MigrationCreate" }
      responses:
        "201":
          description: 已创建
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Migration" }
        "400": { $ref: "#/components/responses/BadRequest" }

  /places:
    get:
      tags: [places]
      summary: 地点列表（历史地名 ↔ 现代政区）
      operationId: listPlaces
      parameters:
        - name: q
          in: query
          schema: { type: string }
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
      responses:
        "200": { $ref: "#/components/responses/Page" }
    post:
      tags: [places]
      summary: 创建地点
      operationId: createPlace
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PlaceCreate" }
      responses:
        "201":
          description: 已创建
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Place" }

  /places/{id}:
    parameters:
      - $ref: "#/components/parameters/Id"
    get:
      tags: [places]
      summary: 地点详情
      operationId: getPlace
      responses:
        "200":
          description: 成功
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Place" }
        "404": { $ref: "#/components/responses/NotFound" }
    patch:
      tags: [places]
      summary: 更新地点（地点表无 rev，不走乐观锁）
      operationId: updatePlace
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PlaceUpdate" }
      responses:
        "200":
          description: 成功
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Place" }
        "404": { $ref: "#/components/responses/NotFound" }
    delete:
      tags: [places]
      summary: 删除地点
      operationId: deletePlace
      responses:
        "204": { description: 已删除 }

  /search:
    get:
      tags: [search-stats]
      summary: 全文 + 结构化检索
      operationId: search
      parameters:
        - name: q
          in: query
          schema: { type: string }
        - name: scope
          in: query
          description: |
            检索范围。person=人物；document=文档正文（M7.4 trigram FTS，
            中文子串可命中，1-2 字查询回退 LIKE）；all=两者合并（items
            带 kind 判别字段，人物在前）。未知 scope 返回 400。
          schema: { enum: [person, document, all], default: all }
        - name: lineage_id
          in: query
          description: |
            限定单谱（多谱同库检索谱内化）：提供时只命中该宗族的
            人物/文档；省略则跨全部宗族。
          schema: { type: string }
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
      responses:
        "200": { $ref: "#/components/responses/Page" }

  /stats:
    get:
      tags: [search-stats]
      summary: 统计
      operationId: getStats
      responses:
        "200":
          description: 成功
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Stats" }

  /validate:
    post:
      tags: [validate]
      summary: 运行校验规则
      operationId: runValidation
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                rule_ids:
                  type: array
                  items: { type: string }
      responses:
        "200":
          description: 校验完成
          content:
            application/json:
              schema:
                type: object
                properties:
                  issues:
                    type: array
                    items: { $ref: "#/components/schemas/ValidationIssue" }
                  summary:
                    type: object
                    properties:
                      error: { type: integer }
                      warning: { type: integer }
                      info: { type: integer }

  /audit:
    get:
      tags: [search-stats]
      summary: 变更史回溯（M8.5；仅 steward——diff 含原始数据）
      operationId: queryAudit
      parameters:
        - name: entity_type
          in: query
          schema: { type: string }
        - name: entity_id
          in: query
          schema: { type: string }
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
      responses:
        "200":
          description: 成功（id 倒序，新变更在前）
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: "#/components/schemas/AuditEntry" }
                  page:
                    type: object
                    properties:
                      next_cursor: { type: [string, "null"] }
                      has_more: { type: boolean }
        "403": { $ref: "#/components/responses/Forbidden" }

  /imports/gedcom:
    post:
      tags: [import-export]
      summary: GEDCOM 导入
      operationId: importGedcom
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file, lineage_id]
              properties:
                file: { type: string, format: binary }
                lineage_id: { type: string }
      responses:
        "200":
          description: 导入完成（含映射损失报告）
          content:
            application/json:
              schema:
                type: object
                properties:
                  imported: { type: integer }
                  skipped: { type: integer }
                  warnings:
                    type: array
                    items: { type: string }

  /exports/gedcom:
    get:
      tags: [import-export]
      summary: GEDCOM 导出
      operationId: exportGedcom
      parameters:
        - name: lineage_id
          in: query
          required: true
          schema: { type: string }
      responses:
        "200":
          description: GEDCOM 文件
          content:
            text/plain:
              schema: { type: string }

  /exports/tree:
    get:
      tags: [import-export]
      summary: 世系图导出
      operationId: exportTree
      parameters:
        - name: person_id
          in: query
          required: true
          schema: { type: string }
        - name: format
          in: query
          description: dot / mermaid 直接可用；svg 需 graphviz，后续开放
          schema: { enum: [dot, mermaid] }
      responses:
        "200":
          description: 图文件
          content:
            text/plain:
              schema: { type: string }
        "501":
          $ref: "#/components/responses/NotImplemented"

  /events/stream:
    get:
      tags: [events]
      summary: SSE 变更通知（多端协同）
      description: |
        text/event-stream 长连接。任一写操作（人物/宗族/支派/婚姻/
        事件/地点的建档、更新、删除）成功后，所有连接实时收到一帧
        event: change，data 为 EventNotice JSON。

        断线重连间隔见初始帧的 retry: 3000。本地单机模式同样可用
        （只有本机能连，开了无害）；补偿读取代游标分页的 list 端点
        （总线不重放历史事件）。
      operationId: streamEvents
      responses:
        "200":
          description: 事件流
          content:
            text/event-stream:
              schema: { type: string }
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
        "429":
          $ref: "#/components/responses/RateLimited"

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  parameters:
    Id:
      name: id
      in: path
      required: true
      schema: { type: string }
    Limit:
      name: limit
      in: query
      schema: { type: integer, default: 50, minimum: 1, maximum: 200 }
    Cursor:
      name: cursor
      in: query
      schema: { type: string }
    # If-Match 是**请求头参数**，必须放 parameters 段并带 name/in——
    # 曾经误放在 headers 段（那是响应头的段），从 parameters 引用它时
    # 解析出来的对象没有 name/in，元 schema 校验直接失败。
    # 语义见 5.2.1：写操作必须带 If-Match（当前 rev），缺失 428，不符 409。
    IfMatch:
      name: If-Match
      in: header
      required: true
      description: 期望的实体版本（当前 rev）；缺失返回 428，不匹配返回 409
      schema: { type: string }

  headers:
    ETag:
      description: 实体版本（rev）
      schema: { type: string }

  responses:
    Page:
      description: 分页列表
      content:
        application/json:
          schema:
            type: object
            properties:
              data:
                type: array
                items: { type: object }
              page:
                type: object
                properties:
                  next_cursor: { type: [string, "null"] }
                  has_more: { type: boolean }
    BadRequest:
      description: 参数校验失败（code 1001）
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
    Unauthorized:
      description: 未认证（code 3001）
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
    NotFound:
      description: 资源不存在（code 2001）
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
    Forbidden:
      description: 角色无权执行此操作（需要更高角色）
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Problem" }
    Conflict:
      description: 版本冲突（code 2009）
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
    PreconditionRequired:
      description: 缺少 If-Match 头——写操作必须携带当前 rev（code 2009，detail 含当前 rev）
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
    Unprocessable:
      description: 领域规则不满足（如历法超出 1900-2100，code 5001）
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
    UnsupportedMediaType:
      description: 请求体媒体类型不被接受（code 1002）——API 只接受 application/json；multipart 仅 /imports/gedcom 消费（第三轮新-8 同步）
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
    RateLimited:
      description: 请求过于频繁（code 42901）——按 IP 令牌桶限流，Retry-After 按回填速率动态计算
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
    NotImplemented:
      description: 功能明确不实现（如 /exports/tree 的 format=svg 需 graphviz，code 9001）
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
    ServiceUnavailable:
      description: SSE 订阅数已达上限（code 9002，默认 64）——客户端按 retry 帧间隔退避重连
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }

  schemas:
    Role:
      type: string
      enum: [steward, editor, viewer]

    GenealogyDate:
      type: object
      properties:
        calendar: { enum: [gregorian, lunar], default: gregorian }
        gregorian: { type: string, format: date }
        lunar: { type: string, description: 谱面原文 }
        ganzhi: { type: string }
        era:
          type: object
          properties:
            name: { type: string }
            year: { type: integer }
        precision: { enum: [day, month, year, decade, fuzzy], default: day }
        qualifier: { type: string, description: "约/以前/以后" }
      examples:
        - calendar: lunar
          lunar: "同治三年四月初四"
          gregorian: "1864-05-09"
          era: { name: "同治", year: 3 }
          precision: day

    Source:
      type: object
      properties:
        id: { type: string }
        type: { enum: [genealogy_book, local_gazetteer, stele, oral, archive, photo, dna, document, other] }
        title: { type: string }
        author: { type: string }
        year_text: { type: string, description: 年份照录原文（嘉庆四年 等） }
        repository: { type: string, description: 收藏机构 }
        uri: { type: string }
        citation: { type: string, description: 规范引文原文 }
        note: { type: string }

    SourceCreate:
      type: object
      required: [type, title]
      properties:
        type: { enum: [genealogy_book, local_gazetteer, stele, oral, archive, photo, dna, document, other] }
        title: { type: string }
        author: { type: string }
        year_text: { type: string }
        repository: { type: string }
        uri: { type: string }
        citation: { type: string }
        note: { type: string }

    Citation:
      type: object
      properties:
        id: { type: string }
        subject_type: { enum: [person, event, union, migration, branch, lineage] }
        subject_id: { type: string }
        source_id: { type: string }
        locator: { type: string, description: 定位串（卷/页/字段路径，如 卷三 p136 或 birth_date） }
        confidence: { enum: [high, medium, low, disputed] }
        note: { type: string }

    CitationCreate:
      type: object
      required: [subject_type, subject_id, source_id]
      properties:
        subject_type: { enum: [person, event, union, migration, branch, lineage] }
        subject_id: { type: string }
        source_id: { type: string }
        locator: { type: string }
        confidence: { enum: [high, medium, low, disputed], default: medium }
        note: { type: string }

    Document:
      type: object
      properties:
        id: { type: string }
        lineage_id: { type: string }
        type:
          enum: [preface, rule, regulation, literature, contract, edition_note]
        title: { type: string }
        author: { type: string }
        date_text: { type: string }
        edition: { type: string }
        content: { type: string }
        seq: { type: [integer, "null"] }

    DocumentCreate:
      type: object
      required: [lineage_id, type, title]
      properties:
        lineage_id: { type: string }
        type:
          enum: [preface, rule, regulation, literature, contract, edition_note]
        title: { type: string }
        author: { type: string }
        date_text: { type: string }
        edition: { type: string }
        content: { type: string }
        seq: { type: [integer, "null"] }

    PersonName:
      type: object
      properties:
        id: { type: string }
        person_id: { type: string }
        name: { type: string }
        name_type:
          enum: [genealogy, infant, school, renamed, posthumous]
        start_date: { $ref: "#/components/schemas/GenealogyDate" }
        end_date: { $ref: "#/components/schemas/GenealogyDate" }
        is_primary: { type: boolean }
        note: { type: string }

    PersonNameCreate:
      type: object
      required: [name, name_type]
      properties:
        name: { type: string }
        name_type:
          enum: [genealogy, infant, school, renamed, posthumous]
        start_date: { $ref: "#/components/schemas/GenealogyDate" }
        end_date: { $ref: "#/components/schemas/GenealogyDate" }
        is_primary: { type: boolean }
        note: { type: string }

    AuditEntry:
      type: object
      properties:
        id: { type: string }
        entity_type: { type: string }
        entity_id: { type: string }
        action: { enum: [insert, update, delete] }
        actor: { type: string }
        at: { type: string }
        diff: { type: object }

    Person:
      type: object
      properties:
        id: { type: string }
        lineage_id: { type: string }
        branch_id: { type: string }
        family_name: { type: string }
        given_name: { type: string }
        courtesy_name: { type: string, description: 字 }
        art_name: { type: string, description: 号 }
        alias: { type: string, description: 别称/改名前名 }
        posthumous_title: { type: string }
        gender: { enum: [male, female, unknown] }
        generation_no: { type: integer }
        birth_order: { type: integer, description: 行几 }
        is_heir: { type: boolean, description: 承重/嫡嗣 }
        is_living: { type: boolean }
        privacy_level: { enum: [public, kin, private] }
        birth_date: { $ref: "#/components/schemas/GenealogyDate" }
        death_date: { $ref: "#/components/schemas/GenealogyDate" }
        burial_place_id: { type: string }
        biography: { type: string }
        # 亲子改指/解除：字符串改指，null 解除（解除后置回未登记）
        father_id: { type: [string, "null"] }
        mother_id: { type: [string, "null"] }
        portrait_attachment_id: { type: string }
        rev: { type: integer }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
        # expand 展开的子资源（GET /persons/{id}?expand=…，见该端点的
        # expand 参数）：不展开时字段不出现，故均为可选；按 keyset
        # 分页拉全（安全上限 1 万条）。
        events:
          type: array
          description: expand 含 events 时返回；此人的事件列表
          items: { $ref: "#/components/schemas/Event" }
        unions:
          type: array
          description: expand 含 unions 时返回；此人参与的结合（含成员角色）
          items: { $ref: "#/components/schemas/Union" }
        migrations:
          type: array
          description: expand 含 migrations 时返回；此人的迁徙记录
          items: { $ref: "#/components/schemas/Migration" }
        _links:
          type: object
          additionalProperties: { type: string }

    PersonCreate:
      type: object
      required: [lineage_id, family_name, given_name, gender]
      properties:
        lineage_id: { type: string }
        branch_id: { type: string }
        family_name: { type: string }
        given_name: { type: string }
        courtesy_name: { type: string }
        art_name: { type: string }
        gender: { enum: [male, female, unknown] }
        generation_no: { type: integer }
        birth_order: { type: integer }
        is_heir: { type: boolean }
        is_living: { type: boolean }
        birth_date: { $ref: "#/components/schemas/GenealogyDate" }
        death_date: { $ref: "#/components/schemas/GenealogyDate" }
        biography: { type: string }
        note: { type: string, description: 出处页码/备注（转录纪律：必带 谱pNN） }
        father_id: { type: string }
        mother_id: { type: [string, "null"] }

    PersonUpdate:
      type: object
      properties:
        branch_id: { type: string }
        courtesy_name: { type: string }
        generation_no: { type: integer }
        birth_order: { type: integer }
        birth_date: { $ref: "#/components/schemas/GenealogyDate" }
        death_date: { $ref: "#/components/schemas/GenealogyDate" }
        biography: { type: string }
        is_living: { type: boolean }
        privacy_level: { enum: [public, kin, private] }

    Lineage:
      type: object
      properties:
        id: { type: string }
        name: { type: string }
        surname: { type: string }
        surname_origin: { type: string }
        commandery: { type: string }
        hall_name: { type: string }
        generation_poem: { type: string }
        rev: { type: integer }

    LineageCreate:
      type: object
      required: [name, surname]
      properties:
        name: { type: string }
        surname: { type: string }
        surname_origin: { type: string }
        commandery: { type: string }
        hall_name: { type: string }
        generation_poem: { type: string }

    LineageUpdate:
      type: object
      properties:
        name: { type: string }
        surname_origin: { type: string }
        commandery: { type: string }
        hall_name: { type: string }
        generation_poem: { type: string }

    Branch:
      type: object
      properties:
        id: { type: string }
        lineage_id: { type: string }
        name: { type: string }
        founder_person_id: { type: string }
        parent_branch_id: { type: string }
        generation_char: { type: string }
        rev: { type: integer }

    BranchCreate:
      type: object
      required: [lineage_id, name]
      properties:
        lineage_id: { type: string }
        name: { type: string }
        founder_person_id: { type: string }
        parent_branch_id: { type: string }
        generation_char: { type: string }

    BranchNode:
      type: object
      properties:
        id: { type: string }
        name: { type: string }
        generation_char: { type: string }
        children:
          type: array
          items: { $ref: "#/components/schemas/BranchNode" }

    Union:
      type: object
      properties:
        id: { type: string }
        type: { enum: [marriage, concubinage, remarriage] }
        status: { enum: [active, dissolved] }
        sequence: { type: integer }
        start_date: { $ref: "#/components/schemas/GenealogyDate" }
        end_date: { $ref: "#/components/schemas/GenealogyDate" }
        place_id: { type: string }
        members:
          type: array
          items:
            type: object
            properties:
              person_id: { type: string }
              role: { enum: [husband, wife, concubine] }
        rev: { type: integer }

    UnionCreate:
      type: object
      required: [type, members]
      properties:
        type: { enum: [marriage, concubinage, remarriage] }
        sequence: { type: integer }
        start_date: { $ref: "#/components/schemas/GenealogyDate" }
        place_id: { type: string }
        members:
          type: array
          minItems: 2
          items:
            type: object
            required: [person_id, role]
            properties:
              person_id: { type: string }
              role: { enum: [husband, wife, concubine] }

    EventType:
      type: string
      enum: [birth, death, burial, marriage, migration, examination, office,
             honor, residence, annotation]

    Event:
      type: object
      properties:
        id: { type: string }
        subject_type: { enum: [person, union, branch, lineage] }
        subject_id: { type: string }
        type: { $ref: "#/components/schemas/EventType" }
        date: { $ref: "#/components/schemas/GenealogyDate" }
        place_id: { type: string }
        description: { type: string }

    EventCreate:
      type: object
      required: [subject_type, subject_id, type]
      properties:
        subject_type: { enum: [person, union, branch, lineage] }
        subject_id: { type: string }
        type: { $ref: "#/components/schemas/EventType" }
        date: { $ref: "#/components/schemas/GenealogyDate" }
        place_id: { type: string }
        description: { type: string }

    Place:
      type: object
      properties:
        id: { type: string }
        name: { type: string }
        type:
          enum: [village, town, county, prefecture, province, grave, ancestral_hall, other]
        modern_admin: { type: string }
        historical_name: { type: string }
        lat: { type: number }
        lng: { type: number }

    PlaceCreate:
      type: object
      required: [name]
      properties:
        name: { type: string }
        type:
          enum: [village, town, county, prefecture, province, grave, ancestral_hall, other]
        modern_admin: { type: string }
        historical_name: { type: string }
        lat: { type: number }
        lng: { type: number }

    PlaceUpdate:
      type: object
      description: 地点表无 rev，不走乐观锁；type 建档后不可改
      properties:
        name: { type: string }
        modern_admin: { type: string }
        historical_name: { type: string }
        lat: { type: number }
        lng: { type: number }

    Migration:
      type: object
      description: |
        迁徙记录。date 为 GenealogyDate 对象（谱面原文优先）；
        from/to 挂 place id，地图渲染按 place 的经纬度连线。
      properties:
        id: { type: string }
        subject_type: { enum: [person, branch] }
        subject_id: { type: string }
        from_place_id: { type: string }
        to_place_id: { type: string }
        date: { $ref: "#/components/schemas/GenealogyDate" }
        reason: { type: string }
        route: { type: string }
        note: { type: string }

    MigrationCreate:
      type: object
      required: [subject_type, subject_id, to_place_id]
      properties:
        subject_type: { enum: [person, branch] }
        subject_id: { type: string }
        from_place_id: { type: string }
        to_place_id: { type: string }
        date: { $ref: "#/components/schemas/GenealogyDate" }
        reason: { type: string, description: 迁因（经商/避乱/仕进/投亲…） }
        route: { type: string, description: 迁经路线文字描述 }
        note: { type: string }

    MourningDegree:
      type: object
      properties:
        # garment 取值 = shared/rules/mourning_*.json 里 grades 的 id，
        # 客户端可据此做本地化；不要按数组顺序推断等级高低。
        garment:
          enum: [zhancui, qicui_zhang, qicui_buzhang, qicui_wuyue,
                 qicui_sanyue, dagong, xiaogong, sima, tanmian, wufu]
        garment_name: { type: string }
        duration_months: { type: integer }
        rule_id:
          type: string
          description: 命中的规则标识（规则表的 path 步骤序列）；
            兜底推断时为 "fallback"。
        ruleset: { enum: [ming_qing] }
        basis: { type: string }

    Appellation:
      type: object
      properties:
        standard: { type: string }
        colloquial: { type: string }
        formal: { type: string }
        elder: { type: boolean }
        path:
          type: array
          items: { type: string }

    AncestorTree:
      type: object
      properties:
        person: { $ref: "#/components/schemas/Person" }
        generations:
          type: array
          items:
            type: object
            properties:
              depth: { type: integer }
              persons:
                type: array
                items: { $ref: "#/components/schemas/Person" }

    DescendantTree:
      type: object
      properties:
        person: { $ref: "#/components/schemas/Person" }
        children:
          type: array
          items: { $ref: "#/components/schemas/DescendantTree" }

    LineageGraph:
      type: object
      description: 世系图数据（节点 + 边，客户端自绘）
      properties:
        mode: { enum: [five_generation, full] }
        nodes:
          type: array
          items: { $ref: "#/components/schemas/Person" }
        edges:
          type: array
          items:
            type: object
            properties:
              from: { type: string }
              to: { type: string }
              type: { enum: [birth, adoption, marriage] }

    Stats:
      type: object
      properties:
        person_count: { type: integer }
        event_count: { type: integer }
        branch_count:
          type: integer
          description: 支派统计暂恒 0（按宗族拆分随 M5 lineage 维度补齐）
        living_count: { type: integer }
        uncited_facts:
          type: integer
          description: 无证据事实数（数据质量核心指标）；
            当前无 Source/Citation 模型，恒 0（M5 证据链补齐后生效）
        generation_distribution:
          type: array
          items:
            type: object
            properties:
              generation_no: { type: integer }
              count: { type: integer }

    ValidationIssue:
      type: object
      properties:
        rule_id: { type: string }
        severity: { enum: [error, warning, info] }
        entity_type: { type: string }
        entity_id: { type: string }
        message: { type: string }
        suggestion: { type: string }

    Problem:
      type: object
      properties:
        type: { type: string, format: uri }
        title: { type: string }
        status: { type: integer }
        detail: { type: string }
        code: { type: integer }
        instance: { type: string }
        errors:
          type: array
          items:
            type: object
            properties:
              field: { type: string }
              message: { type: string }

    EventNotice:
      type: object
      description: |
        SSE 变更帧的 data 载荷（GET /events/stream）。
        type 形如 person.updated / union.created；rev 对无版本表的
        实体（event/place）缺省。
      properties:
        type: { type: string }
        subject_type:
          enum: [person, lineage, branch, union, event, place]
        subject_id: { type: string }
        rev: { type: integer }
        at: { type: string, format: date-time }

# ---------------------------------------------------------------- 路线图
# 以下端点族 schema 表已在 M0 建好（shared/schema），但 core 领域模型与
# REST 实现属于 M5 交付范围（设计文档里程碑表：M5 多客户端外接 =
# Web UI 参考实现、SSE 协同、迁徙地图）。本规范为「已实现能力」定稿，
# 规划端点不进入 paths——声明了却返回 501/404 的端点比没有更坏：
# 第三方按 spec 开发必然踩空。M5 实现时同步加回 paths 与 schemas。
x-roadmap:
  planned_paths:
    - /persons/{id}/names        # 名号变更（谱名/乳名/学名/改后名），M7.1
    - /attachments               # 遗像/扫描件上传下载（内容寻址），暂缓项
  planned_schemas:
    - Attachment
  planned_behaviors:
    - 在世者脱敏          # 设计文档 4.9/6.5：is_living + privacy_level 联动，
                         # API 与导出按级别屏蔽生卒/住址/肖像。本地单机模式
                         # 无跨用户暴露面，故后置；viewer 角色落地时同步做
    - audit_log 写入      # 设计文档 4.9：全部写操作的 JSON diff 审计轨迹。
                         # schema 表已建（audit_log），service 层未接线
    - 写串行化队列        # 设计文档 3.3/8：SQLite 单写者。当前多线程并发写
                         # 依赖 SQLite 自带锁，10 万级灌库验收为单线程口径
